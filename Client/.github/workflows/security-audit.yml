name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        working-directory: ./Client
        run: npm ci

      - name: Run security audit
        working-directory: ./Client
        run: node scripts/security-audit.js
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: Client/security-audit-report.json
          retention-days: 30

      - name: Comment PR with audit results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './Client/security-audit-report.json';

            if (fs.existsSync(path)) {
              const report = JSON.parse(fs.readFileSync(path, 'utf8'));
              
              const body = `## 🔒 Security Audit Report
              
              **Status:** ${report.passed ? '✅ PASSED' : '❌ FAILED'}
              
              ### Vulnerability Summary
              - **Critical:** ${report.summary.critical || 0}
              - **High:** ${report.summary.high || 0}  
              - **Moderate:** ${report.summary.moderate || 0}
              - **Low:** ${report.summary.low || 0}
              - **Outdated Dependencies:** ${report.summary.outdated || 0}
              
              ${report.recommendations.length > 0 ? `### Recommendations
              ${report.recommendations.map(r => `- **${r.priority.toUpperCase()}:** ${r.action}`).join('\n')}` : ''}
              
              ${!report.passed ? `### Failures
              ${report.failures.map(f => `- ${f}`).join('\n')}` : ''}
              
              <details>
              <summary>View detailed report</summary>
              
              \`\`\`json
              ${JSON.stringify(report, null, 2)}
              \`\`\`
              </details>`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Fail job if audit failed
        working-directory: ./Client
        run: |
          if [ -f security-audit-report.json ]; then
            if ! node -e "const report = require('./security-audit-report.json'); process.exit(report.passed ? 0 : 1)"; then
              echo "Security audit failed - see report for details"
              exit 1
            fi
          fi
