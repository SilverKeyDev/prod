# Pre-commit hooks for SilverKey
#
# Hooks run on commit so local failures are caught before a commit is created.
# Install:
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit
# Optional: pre-commit install --hook-type pre-push  # also check before pushing
#
# Resilient hooks (skip if pre-commit missing): git config core.hooksPath scripts/githooks
# Run manually: pre-commit run --all-files

default_stages: [pre-commit]

repos:
  # Secret scanning — temporarily disabled (SSL / env issues fetching gitleaks hook).
  # Re-enable when fixed: uncomment below.
  # - repo: https://github.com/gitleaks/gitleaks
  #   rev: v8.18.4
  #   hooks:
  #     - id: gitleaks

  # Python: Ruff (linting + formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^Server/
      # Formatter
      - id: ruff-format
        files: ^Server/

  # Mypy is not run in pre-commit: the Server gate is ruff + pyright (see
  # scripts/run-all-linters.sh). Full-tree mypy reports hundreds of gradual-
  # typing issues; run manually: (cd Server && mypy app/).

  # JavaScript/TypeScript: ESLint (Client workspace — same deps as pnpm run lint)
  - repo: local
    hooks:
      - id: eslint-client
        name: eslint (Client)
        language: system
        entry: scripts/pre-commit-eslint-client.sh
        files: ^Client/.*\.(ts|tsx|js|jsx)$
        exclude: ^Client/(dist|coverage|node_modules|build)/.*

  # JavaScript/TypeScript: Prettier (Client workspace — same as pnpm run format; no nodeenv)
  - repo: local
    hooks:
      - id: prettier-client
        name: prettier (Client)
        language: system
        entry: scripts/pre-commit-prettier-client.sh
        files: ^Client/.*\.(ts|tsx|js|jsx|json|css|scss|md)$
        exclude: ^Client/(dist|coverage|node_modules|build)/

  # General: Trailing whitespace and EOF
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^Client/apps/mobile/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: |
          (?x)^(
            .*\.pem\.example$|
            documentation/client/docusign-integration\.md$|
            Server/app/services/docusign/docs/README\.md$|
            Server/app/services/docusign/docs/TESTING\.md$
          )

  # No focused tests
  - repo: local
    hooks:
      - id: no-focused-tests
        name: No focused tests (it.only, describe.only)
        entry: '\b(it|test|describe)\.only\b'
        language: pygrep
        files: ^Client/.*\.(test|spec)\.(ts|tsx|js|jsx)$
        types: [text]
