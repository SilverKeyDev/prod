# Pre-commit hooks for SilverKey (advisory local auto-fix)
#
# On commit (never blocks): Ruff/Prettier/ESLint --fix; OpenAPI regen when spec/generated paths change.
# scripts/githooks/pre-commit re-stages fixes and always exits 0.
# On push: scoped typecheck / contract tests — advisory only (scripts/githooks/pre-push).
# CI on PR: tests + path-scoped OpenAPI; full lint via make lint / weekly workflow.
#
# Install: make setup  (sets git config core.hooksPath scripts/githooks)
# Skip once: SKIP=1 git commit ...
# Run all hooks manually: make precommit
# Strict push check: PRE_PUSH_BLOCKING=1 make pre-push-check

default_stages: [pre-commit]

repos:
  # Secret scanning — temporarily disabled (SSL / env issues fetching gitleaks hook).
  # Re-enable when fixed: uncomment below.
  # - repo: https://github.com/gitleaks/gitleaks
  #   rev: v8.18.4
  #   hooks:
  #     - id: gitleaks

  # --- Phase 1: auto-fix and formatters (mutating; run before checks) ---

  # Disabled locally: mutating hooks fail the commit when they touch files (re-stage loop).
  # - repo: https://github.com/pre-commit/pre-commit-hooks
  #   rev: v4.5.0
  #   hooks:
  #     - id: trailing-whitespace
  #     - id: end-of-file-fixer

  # Python: Ruff formatter, then lint autofix (same as typical CI ordering)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff-format
        args: [--quiet]
        files: ^Server/
      - id: ruff
        args: [--fix, --quiet]
        files: ^Server/

  # Mypy is not run in pre-commit: the Server gate is ruff + pyright (see
  # scripts/ci/run-all-linters.sh). Full-tree mypy reports hundreds of gradual-
  # typing issues; run manually: (cd Server && mypy app/).

  # Client: Prettier first, then ESLint --fix (avoids lint fixes fighting format)
  - repo: local
    hooks:
      - id: prettier-client
        name: prettier (Client)
        language: system
        entry: scripts/ci/pre-commit-prettier-client.sh
        files: ^Client/.*\.(ts|tsx|js|jsx|json|css|scss|md)$
        exclude: ^Client/(dist|coverage|node_modules|build)/.*

  - repo: local
    hooks:
      - id: eslint-client
        name: eslint (Client)
        language: system
        entry: scripts/ci/pre-commit-eslint-client.sh
        files: ^Client/.*\.(ts|tsx|js|jsx)$
        exclude: ^Client/(dist|coverage|node_modules|build)/.*

  - repo: local
    hooks:
      - id: openapi-drift
        name: OpenAPI generated types drift
        language: system
        entry: scripts/ci/pre-commit-openapi-drift.sh
        pass_filenames: false
        files: ^(openapi/|openapi\.yaml|Client/packages/types/api\.generated\.ts|Server/app/schemas/generated\.py)

  # --- Phase 2: checks only (no writes) — disabled locally; CI enforces these ---

  # - repo: https://github.com/pre-commit/pre-commit-hooks
  #   rev: v4.5.0
  #   hooks:
  #     - id: check-yaml
  #       exclude: ^Client/apps/mobile/
  #     - id: check-added-large-files
  #       args: [--maxkb=500]
  #     - id: check-merge-conflict
  #     - id: detect-private-key
  #       exclude: |
  #         (?x)^(
  #           .*\.pem\.example$|
  #           documentation/features/docusign-integration\.md$|
  #           Server/app/services/docusign/docs/README\.md$|
  #           Server/app/services/docusign/docs/TESTING\.md$
  #         )

  # No focused tests — disabled locally; re-enable to block it.only / describe.only in commits.
  # - repo: local
  #   hooks:
  #     - id: no-focused-tests
  #       name: No focused tests (it.only, describe.only)
  #       entry: '\b(it|test|describe)\.only\b'
  #       language: pygrep
  #       files: ^Client/.*\.(test|spec)\.(ts|tsx|js|jsx)$
  #       types: [text]
