type: object
description: >
  Start or end location for routing. Provide a non-empty address and/or both lat and lng.
  The server geocodes when an address is present without coordinates.
properties:
  label:
    type: string
    nullable: true
  address:
    type: string
    nullable: true
  lat:
    type: number
    nullable: true
  lng:
    type: number
    nullable: true
