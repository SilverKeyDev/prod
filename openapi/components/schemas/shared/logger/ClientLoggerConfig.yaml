type: object
description: >
  Frontend logger category toggles with nested API subcategories plus logLevel.
additionalProperties:
  oneOf:
    - type: boolean
    - type: string
    - $ref: './ClientApiSubcategoryConfig.yaml'
required:
  - polling
  - pages
  - hooks
  - auth
  - http
  - api
  - errors
  - security
  - logLevel
properties:
  polling:
    type: boolean
  pages:
    type: boolean
  hooks:
    type: boolean
  auth:
    type: boolean
  http:
    type: boolean
  api:
    oneOf:
      - type: boolean
      - $ref: './ClientApiSubcategoryConfig.yaml'
  errors:
    type: boolean
  security:
    type: boolean
  search:
    type: boolean
  polygonSearch:
    type: boolean
  mapRendering:
    type: boolean
  propertyDetails:
    type: boolean
  negotiation:
    type: boolean
  checklists:
    type: boolean
  calendar:
    type: boolean
  dashboard:
    type: boolean
  messages:
    type: boolean
  feed:
    type: boolean
  routing:
    type: boolean
  docusign:
    type: boolean
  documents:
    type: boolean
  profilePreferences:
    type: boolean
  logLevel:
    type: string
    enum: [DEBUG, INFO, WARN, ERROR]
