type: object
description: >
  Response from GET /healthz or GET /readyz (readiness: database connectivity; /readyz is an alias
  of /healthz). For process-only liveness without a DB round-trip, use GET /livez. Aligns with Flask handlers.
required:
  - status
  - database
additionalProperties: false
properties:
  status:
    type: string
    enum: [ok, error]
  database:
    type: string
    enum: [connected, disconnected]
  error:
    type: string
    description: Present when status is error; connection or query failure detail.
