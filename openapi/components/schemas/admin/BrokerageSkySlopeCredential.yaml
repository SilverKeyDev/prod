type: object
required:
  - brokerage_id
  - provider
  - status
  - created_at
  - updated_at
properties:
  brokerage_id:
    type: string
    description: Brokerage org id (brokerage_orgs.id)
  provider:
    type: string
    enum:
      - skyslope
    description: Integration provider identifier
  key_last4:
    type: string
    nullable: true
    description: Last four characters of the API key (masked display only)
  skyslope_org_id:
    type: string
    nullable: true
    description: Optional SkySlope organization identifier
  status:
    $ref: "./BrokerageSkySlopeCredentialStatus.yaml"
  last_verified_at:
    type: string
    format: date-time
    nullable: true
    description: When connection was last verified successfully
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
