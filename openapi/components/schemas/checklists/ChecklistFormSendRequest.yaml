type: object
required:
  - method
properties:
  method:
    type: string
    enum:
      - docusign
      - messaging
      - both
  conversation_id:
    type: string
    maxLength: 64
    nullable: true
  client_id:
    type: string
    maxLength: 64
    nullable: true
  message:
    type: string
    maxLength: 4000
    nullable: true
  participants:
    type: array
    nullable: true
    items:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
        name:
          type: string
          maxLength: 200
