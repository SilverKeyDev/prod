type: object
required:
  - id
  - user
  - text
  - createdAt
properties:
  id:
    type: string
  user:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      avatarUrl:
        type: string
        format: uri
        nullable: true
  text:
    type: string
  createdAt:
    type: string
  likes:
    type: integer
    nullable: true
