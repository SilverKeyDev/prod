type: object
required:
  - partner_id
properties:
  partner_id:
    type: string
  step_id:
    type: string
  date_from:
    type: string
    format: date-time
  date_to:
    type: string
    format: date-time
  agent_id:
    type: string
  brokerage:
    type: string
  bucket:
    type: string
    enum:
      - day
      - week
    default: day
