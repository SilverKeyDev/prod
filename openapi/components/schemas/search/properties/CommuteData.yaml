type: object
required:
  - travel_times
  - property_address
properties:
  travel_times:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        travel_time:
          type: string
        commute_tolerance:
          type: number
        encoded_polyline:
          type: string
          nullable: true
          description: Google-encoded overview polyline for the driving route from the listing to this location (Directions API).
  property_address:
    type: string
