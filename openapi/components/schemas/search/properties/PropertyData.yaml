type: object
description: |
  DEPRECATED: Use PropertyComplete with submodels instead.
  Legacy flat property data structure. Kept for backward compatibility.
properties:
  streetAddress:
    type: string
    nullable: true
  city:
    type: string
    nullable: true
  state:
    type: string
    nullable: true
  zipcode:
    type: string
    nullable: true
  price:
    type: number
    nullable: true
  listPrice:
    type: number
    nullable: true
  bedrooms:
    type: integer
    nullable: true
    description: Use this field (not beds)
  bathrooms:
    type: number
    nullable: true
    description: Use this field (not baths)
  livingArea:
    type: integer
    nullable: true
    description: Living area in sqft (use this field, not sqft)
  homeType:
    type: string
    nullable: true
    description: Property type (SINGLE_FAMILY, CONDO, etc.)
  lotAreaValue:
    type: number
    nullable: true
  lotAreaUnit:
    type: string
    nullable: true
  listingStatus:
    type: string
    nullable: true
