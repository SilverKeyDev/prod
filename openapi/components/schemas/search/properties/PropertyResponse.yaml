allOf:
  - $ref: '../../shared/core/SuccessResponse.yaml'
  - type: object
    properties:
      query:
        type: object
        nullable: true
        description: "Request parameters (zpid, property_url, or address)"
        properties:
          zpid:
            type: string
            nullable: true
          property_url:
            type: string
            format: uri
            nullable: true
          address:
            type: string
            nullable: true
      data:
        type: object
        nullable: true
        description: "Normalized property data from Slipstream API"
        additionalProperties: true
      features:
        type: object
        nullable: true
        description: "Categorized property features extracted from listing"
        additionalProperties:
          type: array
          items:
            type: string
      commute_data:
        type: object
        nullable: true
        description: "Commute analysis with travel times to important locations"
        properties:
          travel_times:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                travel_time:
                  type: string
                  nullable: true
                commute_tolerance:
                  type: integer
              required: ["name", "address"]
          map_url:
            type: string
            format: uri
            nullable: true
          property_address:
            type: string
            nullable: true
      property_analysis:
        type: object
        nullable: true
        description: "AI-generated property analysis with pros, cons, and detailed sections"
        properties:
          pros:
            type: array
            items:
              type: string
            nullable: true
          cons:
            type: array
            items:
              type: string
            nullable: true
          highlights_context:
            type: object
            nullable: true
            additionalProperties: true
        additionalProperties: true
      image_features:
        type: object
        nullable: true
        description: "Features extracted from property images using AI vision"
        properties:
          raw:
            type: array
            items:
              type: string
          clean:
            type: array
            items:
              type: string
        required: ["raw", "clean"]
      images:
        type: array
        items:
          type: string
          format: uri
        nullable: true
