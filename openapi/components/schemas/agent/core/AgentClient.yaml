type: object
description: |
  Buyer or client row as seen from the agent workspace (client list, messaging, tasks).
  `profile_picture` is a storage key unless a route explicitly expands to a URL.
required:
  - id
  - name
  - email
  - transaction_id
properties:
  id:
    type: string
    description: Application user id for the client.
  transaction_id:
    type: string
    description: |
      Revenue spine id (`transactions.id`) for this client's deal. Use for checklist,
      forms, documents, and rev-share APIs — not the buyer user id.
  name:
    type: string
    description: Display name shown in agent UI and shared documents.
  email:
    type: string
    format: email
    description: Primary contact email for invites and DocuSign routing.
  phone:
    type: string
    nullable: true
    description: E.164 or formatted phone when on file.
  profile_picture:
    type: string
    nullable: true
    description: S3 key or relative path for avatar; not always a public URL.
  created_at:
    type: string
    nullable: true
    description: ISO 8601 timestamp when the client relationship or row was created.
  client_kind:
    type: string
    nullable: true
    description: |
      Client representation from `user_roles` (excluding `agent`). `unknown` when no buyer/seller/investor role is set.
    enum:
      - buyer
      - seller
      - investor
      - unknown
  pipeline_stage:
    type: string
    nullable: true
    description: |
      Checklist area with the most recent completed task activity for this client (preview only).
      `search` when there are no completed checklist tasks yet or activity cannot be determined.
    enum:
      - search
      - offer
      - escrow
      - financing
      - closing
      - insurance
      - unknown
  profile_picture_url:
    type: string
    nullable: true
    description: Short-lived presigned URL for `profile_picture` when available; use for list avatars.
  current_phase:
    type: string
    nullable: true
    description: |
      Active checklist category for this client — first unlocked section with incomplete work.
      Aligns with pipeline categories (`search`, `offer`, …).
    enum:
      - search
      - offer
      - escrow
      - financing
      - closing
      - insurance
      - unknown
  current_step_label:
    type: string
    nullable: true
    description: |
      Human-readable label of the earliest incomplete checklist step in `current_phase`.
      Null when every step in the active phase is complete.
  requires_signature:
    type: boolean
    nullable: true
    description: |
      True when the agent must sign a non-void agreement for this client (client has signed; agent has not).
example:
  id: "c3d4e5f6-a7b8-9012-cdef-345678901234"
  transaction_id: "f1e2d3c4-b5a6-7890-abcd-ef1234567890"
  name: "Jordan Client"
  email: "jordan.client@example.com"
  phone: "+15551112222"
  profile_picture: "profiles/c3d4e5f6-a7b8-9012-cdef-345678901234.jpg"
  created_at: "2025-08-01T16:45:00.000Z"
  client_kind: "buyer"
  pipeline_stage: "search"
  current_phase: "search"
  current_step_label: "Set a budget"
  requires_signature: false
