type: object
required:
  - id
  - conversation_id
  - sender_id
  - role
  - message
  - timestamp
properties:
  id:
    type: string
  conversation_id:
    type: string
  sender_id:
    type: string
  role:
    type: string
    enum: [user, agent, assistant]
  message:
    type: string
  shared_home_id:
    type: string
    nullable: true
  shared_document_id:
    type: string
    nullable: true
  timestamp:
    type: string
  is_read:
    type: boolean
    nullable: true
  read_at:
    type: string
    nullable: true
  event_request_status:
    $ref: '../../shared/event-requests/EventRequestStatus.yaml'
    nullable: true
