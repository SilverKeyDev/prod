type: object
required:
  - tab_label
properties:
  tab_label:
    type: string
    maxLength: 500
    description: DocuSign tabLabel; must match template/PDF placement or anchor.
  value:
    type: string
    maxLength: 2000
    nullable: true
  locked:
    type: boolean
    nullable: true
    description: When true, signer cannot edit (read-only tab).
  document_id:
    type: string
    nullable: true
    default: "1"
  page_number:
    type: integer
    minimum: 1
    maximum: 999
    nullable: true
  x_position:
    type: integer
    nullable: true
  y_position:
    type: integer
    nullable: true
  anchor_string:
    type: string
    maxLength: 500
    nullable: true
  anchor_x_offset:
    type: string
    maxLength: 20
    nullable: true
  anchor_y_offset:
    type: string
    maxLength: 20
    nullable: true
  font_size:
    type: string
    maxLength: 20
    nullable: true
    description: e.g. size10