type: object
required:
  - name
  - roles
properties:
  name:
    type: string
    description: Display name for the DocuSign template.
  description:
    type: string
    nullable: true
  roles:
    type: array
    minItems: 1
    maxItems: 20
    items:
      type: string
    description: >
      Ordered signer role names (e.g. Agent, Buyer). Must match the number of signers
      you will assign in DocuSign after opening the template editor.
