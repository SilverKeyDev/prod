type: object
description: DocuSign envelope expiration settings (maps to notification.expirations).
properties:
  expire_enabled:
    type: boolean
    nullable: true
  expire_after:
    type: integer
    minimum: 1
    maximum: 999
    nullable: true
    description: Days until the envelope expires after send.
  expire_warn:
    type: integer
    minimum: 0
    maximum: 999
    nullable: true
    description: Days before expiry to send a warning.
