type: object
required:
  - title
  - agreement_type
  - buyer_id
properties:
  title:
    type: string
  agreement_type:
    $ref: './AgreementType.yaml'
  buyer_id:
    type: string
  property_address:
    type: string
    nullable: true
  description:
    type: string
    nullable: true
  docusign_source_template_id:
    type: string
    nullable: true
    description: >
      When set, this agreement is sent using this DocuSign template ID instead of an
      uploaded PDF revision. Omit revisions for template-only agreements until send.
