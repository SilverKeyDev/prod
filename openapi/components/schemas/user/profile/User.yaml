type: object
description: >
  Persisted user row shape. Profile GET may add computed fields (e.g. profile_picture_url, roles).
  Agent identity is determined by the presence of role "agent" in user_roles (exposed as roles).
required:
  - id
  - email
  - name
  - is_active
properties:
  id:
    $ref: './UserId.yaml'
  cognito_id:
    type: string
    nullable: true
    description: >
      AWS Cognito `sub` when the account uses Cognito credentials; null for Google-only
      accounts until linked, or when the row predates Cognito linkage.
  google_id:
    type: string
    nullable: true
    description: Google OAuth subject when the account is linked; omit or null for non-Google users.
  email:
    type: string
    format: email
  name:
    type: string
    minLength: 1
    maxLength: 200
  phone:
    type: string
    nullable: true
  created_at:
    type: string
    format: date-time
    nullable: true
  updated_at:
    type: string
    format: date-time
    nullable: true
  last_logged_in:
    type: string
    format: date-time
    nullable: true
    description: ISO 8601 timestamp of last successful session activity when tracked.
  is_active:
    type: boolean
  mls_id:
    type: string
    nullable: true
  brokerage:
    type: string
    nullable: true
    description: >
      Agent brokerage name on the users row (DB column brokerage). API wire name is always brokerage.
  has_preferences:
    type: boolean
    nullable: true
  preferences_version:
    type: string
    nullable: true
    description: Preferences schema version marker on users row (e.g. v1); null when unset.
  profile_picture:
    type: string
    nullable: true
    description: S3 object key for the profile image when stored server-side.
  profile_picture_url:
    type: string
    format: uri
    nullable: true
    description: Presigned URL when returned by profile/upload handlers.
  roles:
    type: array
    items:
      type: string
    description: Role names from user_roles (e.g. agent, buyer, seller). Agent UX uses roles includes agent.
  brokerage_org_ids:
    type: array
    items:
      type: string
    nullable: true
    description: >
      Brokerage organization ids from `user_org_memberships` for attribution and admin scope.
example:
  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  email: "jane.buyer@example.com"
  name: "Jane Buyer"
  is_active: true
  phone: "+15551234567"
  cognito_id: "us-east-1_a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  google_id: null
  has_preferences: true
  roles:
    - buyer
  created_at: "2024-01-15T10:30:00.000Z"
  updated_at: "2026-04-01T14:22:00.000Z"
  last_logged_in: "2026-04-07T09:15:00.000Z"
