allOf:
  - $ref: '../../shared/core/SuccessResponse.yaml'
  - type: object
    description: >
      Favorites list returned by POST /favorite-homes (bulk replace), /favorite-homes/add,
      and /favorite-homes/remove. Each item matches OpenAPI SavedHome (PropertyCache + UserPropertyLink).
      `message` is defined on SuccessResponse.
    properties:
      favorites:
        type: array
        items:
          $ref: './SavedHome.yaml'
        nullable: true
