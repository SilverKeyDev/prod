    VoidAgreementResponse:
      $ref: "./components/schemas/agreements/agreements/VoidAgreementResponse.yaml"

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly JWT access token (primary browser auth).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional Authorization header fallback (same JWT as session cookie).

paths:
  /api/v1/agent/clients:
    get:
      tags:
        - Agent
      summary: List agent clients
      description: Returns clients assigned to the authenticated agent.
      operationId: getAgentClients
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Clients retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentClientsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an agent or lacks access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Log in with email and password
      description: Authenticates via Cognito; sets HttpOnly session and refresh_token
        cookies on success.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginData"
      responses:
        "200":
          description: Login result (success or verification-required shape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out
      description: Clears auth cookies.
      operationId: logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh session
      description: |
        Uses the session cookie (access JWT) and refresh_token cookie to issue new tokens. There is no separate GET /auth/session route; clients treat a successful refresh or GET /api/v1/user/profile as the session check.
      operationId: refreshToken
      responses:
        "200":
          description: Tokens refreshed; new cookies set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Missing or invalid tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Transient upstream error (e.g. Google refresh network failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupData"
      responses:
        "200":
          description: Signup result (may require email verification)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/preferences:
    get:
      tags:
        - Preferences
      summary: Get current user preferences
      operationId: getPreferences
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Preferences payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      preferences:
                        $ref: "#/components/schemas/PreferencesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Preferences
      summary: Create or update user preferences
      description: |
        Persists preference payload for the current user. There is no PUT /api/v1/user/profile; profile-adjacent data is updated here (and closing mode via PUT /api/v1/user/closing-mode, not documented in this core set).
      operationId: upsertPreferences
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePreferencesRequest"
      responses:
        "200":
          description: Preferences saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      preferences:
                        $ref: "#/components/schemas/PreferencesResponse"
                      message:
                        type: string
        "400":
          description: Invalid or empty body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/agent-profile/{userId}:
    get:
      tags:
        - Public
      summary: Get public agent profile by user id
      description: >
        Unauthenticated read-only agent directory row for shareable profile URLs.
        Returns 404 if the user does not exist, is not an agent, or is inactive.
        Web client public pages use path `/agent-profile/{nameSlug}/{userId}` (name slug first; `userId` is this path parameter).
      operationId: getPublicAgentProfile
      parameters:
        - name: userId
          in: path
          required: true
          description: Agent application user id (users.id).
          schema:
            $ref: "#/components/schemas/UserId"
      responses:
        "200":
          description: Public agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAgentProfileResponse"
        "404":
          description: Not found or not a public agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/public/agent-profile/slug/{publicProfileSlug}:
    get:
      tags:
        - Public
      summary: Get public agent profile by short slug
      description: >
        Same payload as `getPublicAgentProfile`, keyed by `users.public_profile_slug` (used for `/a/{slug}` links).
        Returns 404 if the slug is invalid, taken by a non-agent, or unknown.
      operationId: getPublicAgentProfileBySlug
      parameters:
        - name: publicProfileSlug
          in: path
          required: true
          description: Value of `PublicAgentProfile.public_profile_slug` / `users.public_profile_slug`.
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Public agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAgentProfileResponse"
        "404":
          description: Not found or not a public agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/search/properties-by-polygon:
    post:
      tags:
        - Search
      summary: Search homes by viewport polygon
      description: |
        Primary authenticated polygon search. Replaces a hypothetical POST /search/homes (no such route).
      operationId: searchPropertiesByPolygon
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchByPolygonRequest"
      responses:
        "200":
          description: Search result or cached read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchByPolygonResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cannot resolve preferences scope for subject user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Search pipeline error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/favorite-homes:
    get:
      tags:
        - User
      summary: List favorite and listing homes
      description: Paginated liked homes plus parallel listings snapshot.
      operationId: listFavoriteHomes
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Favorites and listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteHomesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - User
      summary: Replace favorite homes
      description: Replaces the user's favorites with the provided home objects.
      operationId: replaceFavoriteHomes
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateFavoritesRequest"
      responses:
        "200":
          description: Updated favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteHomesReplaceResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/favorite-homes/add:
    post:
      tags:
        - User
      summary: Add one favorite home
      description: Persists full home payload and returns the updated liked-homes list.
      operationId: addFavoriteHome
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFavoriteRequest"
      responses:
        "200":
          description: Home added; full favorites list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteHomesReplaceResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/favorite-homes/remove:
    post:
      tags:
        - User
      summary: Remove one favorite home by address
      description: Unlikes all matching rows for the normalized address and returns
        remaining liked homes.
      operationId: removeFavoriteHome
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveFavoriteRequest"
      responses:
        "200":
          description: Home removed from favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteHomesReplaceResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found in favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/profile:
    get:
      tags:
        - User
      summary: Get current user profile
      operationId: getUserProfile
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Profile payload (user dict under data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/account/delete:
    post:
      tags:
        - User
      summary: Delete the current user account
      description: |
        Irreversibly deletes the authenticated user and related application data.
        Same hard-delete behavior as admin routes, but only for the signed-in user.
      operationId: deleteMyAccount
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMyAccountRequest"
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "400":
          description: Invalid body (confirm must be true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/data-export:
    get:
      tags:
        - User
      summary: Export the current user data
      description: |
        Returns a JSON document with profile, client UI settings, saved homes, and
        not-interested homes for data-portability requests.
      operationId: exportUserData
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Export payload under `data`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExportResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/profile-picture:
    post:
      tags:
        - User
      summary: Upload user profile picture
      description: Upload and update profile picture (JPEG, PNG, GIF allowed)
      operationId: uploadProfilePicture
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Profile picture uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePictureResponse"
        "400":
          description: Invalid file or file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/closing-mode:
    put:
      tags:
        - User
      summary: Update closing mode status
      description: Toggle user's closing mode (legacy API compatibility only)
      operationId: updateClosingMode
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClosingModeRequest"
      responses:
        "200":
          description: Closing mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateClosingModeResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/client-settings:
    get:
      tags:
        - User
      summary: Get current user client UI settings
      description: >-
        Returns persisted layout, calendar view, saved tab, and optional onboarding draft
        merged with defaults.
      operationId: getUserClientSettings
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Client settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSettingsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - User
      summary: Patch current user client UI settings
      description: Deep-merges partial JSON into stored settings; null removes a top-level key.
      operationId: patchUserClientSettings
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSettings"
      responses:
        "200":
          description: Updated client settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSettingsResponse"
        "400":
          description: Invalid body or payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/user/not-interested:
    get:
      tags:
        - User
      summary: List not-interested homes
      description: Retrieve the user's list of not-interested homes
      operationId: getNotInterestedHomes
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Not-interested homes retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotInterestedHomesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - User
      summary: Mark home as not interested
      description: Add a home to the not-interested list
      operationId: addNotInterestedHome
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddNotInterestedRequest"
      responses:
        "200":
          description: Home marked as not interested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotInterestedHomesResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
