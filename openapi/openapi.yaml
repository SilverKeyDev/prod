  /api/v1/agent/connection-requests:
    get:
      tags: [ Agent ]
      summary: List connection requests
      operationId: getConnectionRequests
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          description: |
            `inbox` (default) returns pending requests awaiting the user's response.
            For agents, client-initiated requests are auto-accepted on create, so inbox is
            typically empty. For clients, inbox lists pending agent-initiated requests they may
            accept or reject. `initiated` returns requests the user sent (pending, accepted, or rejected).
          schema:
            type: string
            enum: [inbox, initiated]
            default: inbox
      responses:
        "200":
          description: HTTP 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionRequestsResponse"
        "400":
          description: HTTP 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [ Agent ]
      summary: Create a connection request
      description: |
        When the client initiates (`requested_by_agent` false), the server auto-accepts and
        returns `status: accepted` (no agent inbox). When the agent initiates, the request stays
        `pending` until the client responds via the respond endpoint.
      operationId: createConnectionRequest
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequestRequest"
      responses:
        "200":
          description: |
            Connection request created. Client-initiated requests are accepted immediately;
            agent-initiated requests remain pending until the client responds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateConnectionRequestResponse"
        "400":
          description: HTTP 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: HTTP 403
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
