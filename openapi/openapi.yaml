openapi: 3.1.0

info:
  title: SilverKey API
  version: 1.0.0
  description: Real estate AI platform API - comprehensive type definitions for
    frontend-backend contract

servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://staging.silverkey.com
    description: Staging environment
  - url: https://api.silverkey.com
    description: Production

tags:
  - name: Auth
    description: >
      Cognito-backed login/signup, HttpOnly cookies, and token refresh. There is
      no GET /auth/session; use POST /auth/refresh-token or GET /user/profile as
      a session probe.
  - name: User
    description: Current-user profile and favorite homes (routes under /api/v1/user).
  - name: Preferences
    description: Create/update persisted preferences (profile-adjacent fields; no
      PUT /user/profile on this API).
  - name: Public
    description: Unauthenticated read-only resources (e.g. shareable agent profile).
  - name: Search
    description: Authenticated property search (polygon pipeline).
  - name: Agent
    description: Agent workspace endpoints (e.g. assigned clients).
  - name: Calendar
    description: Google Calendar OAuth, events, and availability (routes under
      /api/v1/google).
  - name: Feed
    description: Listing feed, likes, and comments (routes under /api/v1/feed).
  - name: Documents
    description: Reports, document library, and secure uploads (routes under
      /api/v1/report, /api/v1/upload).
  - name: Forms
    description: Agent checklist form library (routes under /api/v1/forms).
  - name: DocuSign
    description: DocuSign agreements, templates, and webhooks (routes under
      /api/v1/docusign and /api/v1/webhooks/docusign).
  - name: Admin
    description: Admin-only configuration and user management (routes under /api/v1/admin).
  - name: Client
    description: Client error reporting and diagnostics (routes under /api/v1/client).
  - name: Maps
    description: Google Maps script URL for the frontend (routes under /api/maps).
  - name: Offer
    description: Offer and negotiation helpers (routes under /api/v1/offer).
  - name: Research
    description: Property research and comparison tasks (routes under /api/v1/research).
  - name: Tasks
    description: Unified transaction task checklists (transaction-scoped routes).
  - name: Transactions
    description: Saved transaction address and checklist-linked documents
      (/api/v1/transactions).
  - name: Health
    description: Process liveness (/livez) and database readiness (/healthz and /readyz alias).
  - name: Conversations
    description: Workspace-scoped operator messaging (brokerage, integrator, support).
  - name: Chatbot
    description: Property chatbot for address-based conversations (routes under /api/v1/chat).

