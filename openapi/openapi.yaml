    post:
      tags:
        - Viewings
      summary: Optimize viewing stop order and compute driving legs
      description: >
        Uses Google Distance Matrix (durations) for ordering, then Google Directions for
        per-leg distance, duration, and encoded polylines. Optional start/end anchors:
        when `start` is set, only property stops are reordered; `end_mode` chooses whether
        the tour ends at the last listing, returns to `start`, or ends at a fixed `end`
        location. When `start` is omitted, legacy behavior optimizes an open tour across
        property stops only. Requires a server-side Google Maps API key.
      operationId: buildViewingRoute
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
