# Compare committed Server/endpoints.json against PostHog api_request traffic (7d).
# Informational: exits 0 when dead endpoints exist; fails only on script/API errors.
# Requires repository secrets: POSTHOG_PERSONAL_API_KEY, POSTHOG_PROJECT_ID
name: PostHog dead endpoints check

on:
  schedule:
    # Monday 10:00 America/New_York — after weekly lint (09:00)
    - cron: "0 10 * * 1"
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoints-check-dead:
    name: Dead API endpoint inventory check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --no-cache-dir requests==2.34.2

      - name: Diff inventory vs PostHog api_request (7d)
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: python3 Server/scripts/endpoints/check_dead_endpoints.py
