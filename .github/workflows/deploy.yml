name: Build and Deploy Docker App to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGION: us-east-2
  REPO: cre
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com

      - name: Build, Tag, and Push Docker Image to ECR
        run: |
          docker build --no-cache \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_STRIPE_PUBLIC_KEY=${{ secrets.VITE_STRIPE_PUBLIC_KEY }} \
            --build-arg VITE_GOOGLE_MAPS_ID=${{ secrets.VITE_GOOGLE_MAPS_ID }} \
            -t $REPO:$IMAGE_TAG .
          docker tag $REPO:$IMAGE_TAG $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG
          docker push $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG

      - name: SSH into EC2 and Deploy Container + Copy Frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🕒 Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "🚀 Starting EC2 deployment script..."

            REGION="${{ secrets.AWS_REGION }}"
            REPO="cre"
            IMAGE_TAG="latest"

            echo "📦 Installing Docker and AWS CLI if needed..."
            while sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
                  sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1; do
              echo "🔒 Waiting for apt lock to be released..."
              sleep 3
            done

            sudo apt update -y
            timeout 3m sudo apt install -y docker.io unzip curl > /dev/null

            echo "🧹 Pruning old Docker images..."
            sudo docker system prune -af || true
            sudo docker system prune -af --volumes
            sudo rm -rf /var/lib/docker/tmp/*

            if ! aws --version | grep -q aws-cli; then
              echo "⬇️ Installing AWS CLI..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip && sudo ./aws/install && rm -rf aws awscliv2.zip
            fi

            echo "🔐 Authenticating to ECR..."
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text --region "$REGION")
            IMAGE="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG"
            echo "📦 Using image: $IMAGE"

            aws ecr get-login-password --region "$REGION" | sudo docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"

            echo "📥 Pulling Docker image..."
            sudo docker pull "$IMAGE" || { echo "::error::Docker image pull failed"; exit 1; }

            echo "🛑 Removing old container (if exists)..."
            if sudo docker ps -a --format '{{.Names}}' | grep -Eq '^cre_app$'; then
              sudo docker stop cre_app || true
              sudo docker rm cre_app || true
            fi

            echo "🚀 Starting Celery worker..."
            if sudo docker ps -a --format '{{.Names}}' | grep -Eq '^cre_worker$'; then
              sudo docker stop cre_worker || true
              sudo docker rm cre_worker || true
            fi

            echo "🚀 Ensuring Redis can start cleanly on port 6379..."

            # Kill any process using port 6379
            if sudo lsof -i :6379 -sTCP:LISTEN -t >/dev/null; then
              echo "⚠️ Port 6379 is occupied. Killing PID(s):"
              sudo lsof -i :6379 -sTCP:LISTEN -t | xargs -r sudo kill -9
              sleep 1
            fi

            # Stop and remove any old Redis container
            if sudo docker ps -a --format '{{.Names}}' | grep -q '^redis$'; then
              echo "🧹 Removing old redis container..."
              sudo docker rm -f redis || true
            fi

            # Prune all stopped containers that might be ghosting port usage
            sudo docker container prune -f

            # Relaunch Redis cleanly
            echo "🚀 Starting Redis container..."
            sudo docker run -d --name redis \
              -p 6379:6379 \
              --health-cmd="redis-cli ping || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              --health-start-period=30s \
              redis

            # Health check
            sleep 2
            if ! sudo docker ps --format '{{.Names}}' | grep -q '^redis$'; then
              echo "::error::Redis failed to start. Dumping logs:"
              sudo docker logs redis || true
              exit 1
            else
              echo "✅ Redis container running on port 6379"
            fi



            echo "🚀 Starting new container..."
            sudo docker run -d --name cre_app \
              -p 5000:5000 \
              --health-cmd="curl -f http://localhost:5000/api/v1/user/profile || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              --health-start-period=40s \
              -e AWS_REGION="${{ secrets.AWS_REGION }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e COGNITO_USER_POOL_ID="${{ secrets.COGNITO_USER_POOL_ID }}" \
              -e COGNITO_CLIENT_ID="${{ secrets.COGNITO_CLIENT_ID }}" \
              -e COGNITO_CLIENT_SECRET="${{ secrets.COGNITO_CLIENT_SECRET }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e S3_BUCKET_NAME_PDFS="${{ secrets.S3_BUCKET_NAME_PDFS }}" \
              -e GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
              -e PERPLEXITY_API_KEY="${{ secrets.PERPLEXITY_API_KEY }}" \
              -e VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
              -e STRIPE_PUBLIC_KEY="${{ secrets.STRIPE_PUBLIC_KEY }}" \
              -e STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              -e STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              -e STRIPE_FIVE_REPORTS="${{ secrets.STRIPE_FIVE_REPORTS }}" \
              -e STRIPE_TWENTY_REPORTS="${{ secrets.STRIPE_TWENTY_REPORTS }}" \
              -e STRIPE_FIFTY_REPORTS="${{ secrets.STRIPE_FIFTY_REPORTS }}" \
              -e STRIPE_UNLIMITED_MONTHLY="${{ secrets.STRIPE_UNLIMITED_MONTHLY }}" \
              -e STRIPE_UNLIMITED_YEARLY="${{ secrets.STRIPE_UNLIMITED_YEARLY }}" \
              -e SERP_API="${{ secrets.SERP_API }}" \
              -e OPENAI_KEY="${{ secrets.OPENAI_KEY }}" \
              -e CENSUS_API_KEY="${{ secrets.CENSUS_API_KEY }}" \
              -e HUD_TOKEN="${{ secrets.HUD_TOKEN }}" \
              -e RAPIDAPI_KEY="${{ secrets.RAPIDAPI_KEY }}" \
              -e MAPBOX_API_KEY="${{ secrets.MAPBOX_API_KEY }}" \
              "$IMAGE"
            
            
            echo "🚀 Starting Celery worker container (cre_worker)..."
            sudo docker run -d --name cre_worker \
              --link redis:redis \
              --health-cmd="celery -A app.celery.celery_worker inspect ping || exit 1" \
              --health-interval=60s \
              --health-timeout=30s \
              --health-retries=3 \
              --health-start-period=60s \
              -e AWS_REGION="${{ secrets.AWS_REGION }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e COGNITO_USER_POOL_ID="${{ secrets.COGNITO_USER_POOL_ID }}" \
              -e COGNITO_CLIENT_ID="${{ secrets.COGNITO_CLIENT_ID }}" \
              -e COGNITO_CLIENT_SECRET="${{ secrets.COGNITO_CLIENT_SECRET }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e S3_BUCKET_NAME_PDFS="${{ secrets.S3_BUCKET_NAME_PDFS }}" \
              -e GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
              -e PERPLEXITY_API_KEY="${{ secrets.PERPLEXITY_API_KEY }}" \
              -e VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
              -e STRIPE_PUBLIC_KEY="${{ secrets.STRIPE_PUBLIC_KEY }}" \
              -e STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              -e STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              -e STRIPE_FIVE_REPORTS="${{ secrets.STRIPE_FIVE_REPORTS }}" \
              -e STRIPE_TWENTY_REPORTS="${{ secrets.STRIPE_TWENTY_REPORTS }}" \
              -e STRIPE_FIFTY_REPORTS="${{ secrets.STRIPE_FIFTY_REPORTS }}" \
              -e STRIPE_UNLIMITED_MONTHLY="${{ secrets.STRIPE_UNLIMITED_MONTHLY }}" \
              -e STRIPE_UNLIMITED_YEARLY="${{ secrets.STRIPE_UNLIMITED_YEARLY }}" \
              -e SERP_API="${{ secrets.SERP_API }}" \
              -e OPENAI_KEY="${{ secrets.OPENAI_KEY }}" \
              -e CENSUS_API_KEY="${{ secrets.CENSUS_API_KEY }}" \
              -e HUD_TOKEN="${{ secrets.HUD_TOKEN }}" \
              -e RAPIDAPI_KEY="${{ secrets.RAPIDAPI_KEY }}" \
              -e MAPBOX_API_KEY="${{ secrets.MAPBOX_API_KEY }}" \
              "$IMAGE" \
              celery -A app.celery.celery_worker worker --loglevel=info

            echo "⏳ Waiting for container to boot..."
            sleep 5

            echo "🗂 Copying static frontend from container to host..."
            sudo rm -rf /var/www/html/*
            sudo docker cp cre_app:/app/Client/dist/. /var/www/html/
            sudo chown -R www-data:www-data /var/www/html

            echo "🔍 Verifying container status and health..."
            if ! sudo docker ps --format '{{.Names}}' | grep -q '^cre_app$'; then
              echo "❌ cre_app container is not running. Dumping logs:"
              sudo docker logs cre_app || echo "⚠️ No logs found"
              echo "::error::Container failed to start. Deployment aborted."
              exit 1
            else
              echo "✅ Container is running normally."
              echo "📜 Recent logs:"
              sudo docker logs --tail 20 cre_app || true

              echo "📈 Container health status:"
              sudo docker inspect --format='{{json .State.Health}}' cre_app || echo "ℹ️ No health info"
              
              echo "🔍 Verifying Celery worker health..."
              sudo docker inspect --format='{{json .State.Health}}' cre_worker || echo "ℹ️ No Celery health info"
              
              echo "🔍 Verifying Redis health..."
              sudo docker inspect --format='{{json .State.Health}}' redis || echo "ℹ️ No Redis health info"
            fi