name: Build and Deploy Docker App to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Non-secret constants → use repo variables or keep them here
env:
  REPO: cre
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_REGION:               ${{ secrets.AWS_REGION}}
      AWS_ACCESS_KEY_ID:        ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:    ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EC2_HOST:                 ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY:              ${{ secrets.EC2_SSH_KEY }}
      DATABASE_URL:             ${{ secrets.DATABASE_URL }}
      S3_BUCKET_NAME_PDFS:      ${{ secrets.S3_BUCKET_NAME_PDFS }}
      STRIPE_PUBLIC_KEY:        ${{ secrets.STRIPE_PUBLIC_KEY }}
      STRIPE_SECRET_KEY:        ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET:    ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_FIVE_REPORTS:      ${{ secrets.STRIPE_FIVE_REPORTS }}
      STRIPE_TWENTY_REPORTS:    ${{ secrets.STRIPE_TWENTY_REPORTS }}
      STRIPE_FIFTY_REPORTS:     ${{ secrets.STRIPE_FIFTY_REPORTS }}
      STRIPE_UNLIMITED_MONTHLY: ${{ secrets.STRIPE_UNLIMITED_MONTHLY }}
      STRIPE_UNLIMITED_YEARLY:  ${{ secrets.STRIPE_UNLIMITED_YEARLY }}
      COGNITO_USER_POOL_ID:     ${{ secrets.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID:        ${{ secrets.COGNITO_CLIENT_ID }}
      COGNITO_CLIENT_SECRET:    ${{ secrets.COGNITO_CLIENT_SECRET }}
      GOOGLE_MAPS_API_KEY:      ${{ secrets.GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_API_BASE_URL:        ${{ secrets.VITE_API_BASE_URL }}
      PERPLEXITY_API_KEY:       ${{ secrets.PERPLEXITY_API_KEY }}
      SERP_API:                 ${{ secrets.SERP_API }}
      OPENAI_KEY:               ${{ secrets.OPENAI_KEY }}
      CENSUS_API_KEY:           ${{ secrets.CENSUS_API_KEY }}
      HUD_TOKEN:                ${{ secrets.HUD_TOKEN }}
      RAPIDAPI_KEY:             ${{ secrets.RAPIDAPI_KEY }}
      MAPBOX_API_KEY:           ${{ secrets.MAPBOX_API_KEY }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build, Tag, and Push Docker Image to ECR
        run: |
          docker build --no-cache \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            --build-arg VITE_STRIPE_PUBLIC_KEY="$STRIPE_PUBLIC_KEY" \
            -t "$REPO:$IMAGE_TAG" .
          docker tag "$REPO:$IMAGE_TAG" "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO:$IMAGE_TAG"
          docker push "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO:$IMAGE_TAG"

      - name: SSH into EC2 and Deploy Container + Copy Frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🕒 Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "🚀 Starting EC2 deployment script..."

            REGION="$AWS_REGION"
            REPO="$REPO"
            IMAGE_TAG="$IMAGE_TAG"

            echo "📦 Installing Docker and AWS CLI if needed..."
            # (install commands unchanged)...

            echo "🔐 Authenticating to ECR..."
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text --region "$REGION")
            IMAGE="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG"
            echo "📦 Using image: $IMAGE"

            aws ecr get-login-password --region "$REGION" | sudo docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"

            echo "📥 Pulling Docker image..."
            sudo docker pull "$IMAGE" || { echo "::error::Docker image pull failed"; exit 1; }

            # (redis cleanup and start unchanged)...

            echo "🚀 Starting new container..."
            sudo docker run -d --network host --name cre_app \
              -e AWS_REGION="$AWS_REGION" \
              -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              -e COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" \
              -e COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" \
              -e COGNITO_CLIENT_SECRET="$COGNITO_CLIENT_SECRET" \
              -e DATABASE_URL="$DATABASE_URL" \
              -e S3_BUCKET_NAME_PDFS="$S3_BUCKET_NAME_PDFS" \
              -e STRIPE_PROD_ID_BASIC="$STRIPE_PROD_ID_BASIC" \
              -e GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
              -e PERPLEXITY_API_KEY="$PERPLEXITY_API_KEY" \
              -e VITE_API_BASE_URL="$VITE_API_BASE_URL" \
              -e STRIPE_PUBLIC_KEY="$STRIPE_PUBLIC_KEY" \
              -e STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
              -e STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
              -e STRIPE_FIVE_REPORTS="$STRIPE_FIVE_REPORTS" \
              -e STRIPE_TWENTY_REPORTS="$STRIPE_TWENTY_REPORTS" \
              -e STRIPE_FIFTY_REPORTS="$STRIPE_FIFTY_REPORTS" \
              -e STRIPE_UNLIMITED_MONTHLY="$STRIPE_UNLIMITED_MONTHLY" \
              -e STRIPE_UNLIMITED_YEARLY="$STRIPE_UNLIMITED_YEARLY" \
              -e SERP_API="$SERP_API" \
              -e OPENAI_KEY="$OPENAI_KEY" \
              -e CENSUS_API_KEY="$CENSUS_API_KEY" \
              -e HUD_TOKEN="$HUD_TOKEN" \
              -e RAPIDAPI_KEY="$RAPIDAPI_KEY" \
              -e MAPBOX_API_KEY="$MAPBOX_API_KEY" \
              "$IMAGE"

            echo "🚀 Starting Celery worker container (cre_worker)..."
            sudo docker run -d --name cre_worker --network host \
              -e AWS_REGION="$AWS_REGION" \
              -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              -e COGNITO_USER_POOL_ID="$COGNITO_USER_POOL_ID" \
              -e COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID" \
              -e COGNITO_CLIENT_SECRET="$COGNITO_CLIENT_SECRET" \
              -e DATABASE_URL="$DATABASE_URL" \
              -e S3_BUCKET_NAME_PDFS="$S3_BUCKET_NAME_PDFS" \
              -e STRIPE_PROD_ID_BASIC="$STRIPE_PROD_ID_BASIC" \
              -e GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
              -e PERPLEXITY_API_KEY="$PERPLEXITY_API_KEY" \
              -e VITE_GOOGLE_MAPS_API_KEY="$VITE_GOOGLE_MAPS_API_KEY" \
              -e VITE_API_BASE_URL="$VITE_API_BASE_URL" \
              -e STRIPE_PUBLIC_KEY="$STRIPE_PUBLIC_KEY" \
              -e STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
              -e STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
              -e STRIPE_FIVE_REPORTS="$STRIPE_FIVE_REPORTS" \
              -e STRIPE_TWENTY_REPORTS="$STRIPE_TWENTY_REPORTS" \
              -e STRIPE_FIFTY_REPORTS="$STRIPE_FIFTY_REPORTS" \
              -e STRIPE_UNLIMITED_MONTHLY="$STRIPE_UNLIMITED_MONTHLY" \
              -e STRIPE_UNLIMITED_YEARLY="$STRIPE_UNLIMITED_YEARLY" \
              -e SERP_API="$SERP_API" \
              -e OPENAI_KEY="$OPENAI_KEY" \
              -e CENSUS_API_KEY="$CENSUS_API_KEY" \
              -e HUD_TOKEN="$HUD_TOKEN" \
              -e RAPIDAPI_KEY="$RAPIDAPI_KEY" \
              -e MAPBOX_API_KEY="$MAPBOX_API_KEY" \
              "$IMAGE" \
              celery -A app.celery.celery_worker worker --loglevel=info

            echo "⏳ Waiting for container to boot..."
            sleep 5

            echo "🗂 Copying static frontend from container to host..."
            sudo rm -rf /var/www/html/*
            sudo docker cp cre_app:/app/Client/dist/. /var/www/html/
            sudo chown -R www-data:www-data /var/www/html

            echo "🔍 Verifying container status..."
            if ! sudo docker ps --format '{{.Names}}' | grep -q '^cre_app$'; then
              echo "❌ cre_app container is not running. Dumping logs:"
              sudo docker logs cre_app || echo "⚠️ No logs found"
              echo "::error::Container failed to start. Deployment aborted."
              exit 1
            else
              echo "✅ Container is running normally."
              echo "📜 Recent logs:"
              sudo docker logs --tail 20 cre_app || true

              echo "📈 Container health (if available):"
              sudo docker inspect --format='{{json .State.Health}}' cre_app || echo "ℹ️ No health info"
            fi
