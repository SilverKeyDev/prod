name: Build and Deploy Docker App to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGION: us-east-2
  REPO: cre
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com

      - name: Build, Tag, and Push Docker Image to ECR
        run: |
          docker build --no-cache \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }} \
            -t $REPO:$IMAGE_TAG .
          docker tag $REPO:$IMAGE_TAG $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG
          docker push $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG

      - name: SSH into EC2 and Deploy Container + Log Errors
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🕒 Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "🚀 Starting EC2 deployment script..."

            REGION="${{ secrets.AWS_REGION }}"
            REPO="cre"
            IMAGE_TAG="latest"

            echo "📦 Installing Docker and AWS CLI if needed..."
            sudo apt update -y
            timeout 3m sudo apt install -y docker.io unzip curl > /dev/null

            echo "🧹 Pruning old Docker images..."
            sudo docker system prune -af || true

            if ! aws --version | grep -q aws-cli; then
              echo "⬇️ Installing AWS CLI..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip && sudo ./aws/install && rm -rf aws awscliv2.zip
            fi

            echo "🔐 Authenticating to ECR..."
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text --region "$REGION")
            IMAGE="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG"
            echo "📦 Using image: $IMAGE"

            aws ecr get-login-password --region "$REGION" | sudo docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"

            echo "📥 Pulling Docker image..."
            sudo docker pull "$IMAGE" || { echo "::error::Docker image pull failed"; exit 1; }

            echo "🛑 Removing old container (if exists)..."
            if sudo docker ps -a --format '{{.Names}}' | grep -Eq '^cre_app$'; then
              sudo docker stop cre_app || true
              sudo docker rm cre_app || true
            fi

            echo "🚀 Starting new container..."
            sudo docker run -d -p 5000:5000 --name cre_app \
              -v /var/www/html:/app/Client/dist \
              -e AWS_REGION="${{ secrets.AWS_REGION }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e COGNITO_USER_POOL_ID="${{ secrets.COGNITO_USER_POOL_ID }}" \
              -e COGNITO_CLIENT_ID="${{ secrets.COGNITO_CLIENT_ID }}" \
              -e COGNITO_CLIENT_SECRET="${{ secrets.COGNITO_CLIENT_SECRET }}" \
              -e S3_BUCKET_NAME_PDFS="${{ secrets.S3_BUCKET_NAME_PDFS }}" \
              -e STRIPE_PUBLIC_KEY="${{ secrets.STRIPE_PUBLIC_KEY }}" \
              -e STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              -e STRIPE_PROD_ID_BASIC="${{ secrets.STRIPE_PROD_ID_BASIC }}" \
              -e GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
              -e PERPLEXITY_API_KEY="${{ secrets.PERPLEXITY_API_KEY }}" \
              -e VITE_GOOGLE_MAPS_API_KEY="${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" \
              -e VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
              "$IMAGE"

            echo "⏳ Waiting for container to boot..."
            sleep 5

            echo "🔍 Verifying container status..."
            if ! sudo docker ps --format '{{.Names}}' | grep -q '^cre_app$'; then
              echo "❌ cre_app container is not running. Dumping logs:"
              sudo docker logs cre_app || echo "⚠️ No logs found"
              echo "::error::Container failed to start. Deployment aborted."
              exit 1
            else
              echo "✅ Container is running normally."
              echo "📜 Recent logs:"
              sudo docker logs --tail 20 cre_app || true

              echo "📈 Container health (if available):"
              sudo docker inspect --format='{{json .State.Health}}' cre_app || echo "ℹ️ No health info"
            fi
