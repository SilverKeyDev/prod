# Reusable tests only (no PR comments). Safe to call from push/workflow_dispatch
# where GITHUB_TOKEN cannot grant pull-requests: write.
name: Test & Coverage (callable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-test:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: Client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Client
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: Client
        run: pnpm test:coverage

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-coverage
          path: |
            Client/coverage/
          retention-days: 30

  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Hosted runners have limited disk; full requirements/runtime.txt still pulls torch + ML wheels (~multi-GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            Server/requirements/ci.txt
            Server/requirements/test.txt

      - name: Install dependencies
        working-directory: Server
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements/ci.txt
          pip install --no-cache-dir torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements/test.txt
          pip install --no-cache-dir pytest pytest-cov

      - name: Create coverage directory
        working-directory: Server
        run: mkdir -p coverage

      # Full suite includes Server/tests/contract (OpenAPI ↔ Pydantic response checks).
      - name: Run tests with coverage
        working-directory: Server
        run: pytest

      - name: Check module-specific coverage thresholds
        working-directory: Server
        run: python scripts/lint/check_coverage_thresholds.py

      - name: Upload backend coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-coverage
          path: |
            Server/coverage/
          retention-days: 30

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend tests completed" >> $GITHUB_STEP_SUMMARY
          echo "Backend tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
