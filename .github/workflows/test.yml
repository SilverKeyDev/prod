name: Test & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    uses: ./.github/workflows/test-callable.yml

  frontend-coverage-pr-comment:
    name: Frontend coverage PR comment
    needs: tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Client/coverage

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const coveragePath = path.join(process.env.GITHUB_WORKSPACE, 'Client', 'coverage', 'coverage-summary.json');

              if (!fs.existsSync(coveragePath)) {
                console.log('Coverage summary not found, skipping comment');
                return;
              }

              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const total = coverage.total;

              const comment = `## Frontend coverage report

              | Metric | Coverage | Threshold |
              |--------|----------|-----------|
              | Lines | ${total.lines.pct.toFixed(2)}% | 70% (utils/hooks), 50% (features) |
              | Statements | ${total.statements.pct.toFixed(2)}% | 70% (utils/hooks), 50% (features) |
              | Functions | ${total.functions.pct.toFixed(2)}% | 70% (utils/hooks), 50% (features) |
              | Branches | ${total.branches.pct.toFixed(2)}% | 65% (utils/hooks), 45% (features) |

              [View detailed coverage report](../actions/runs/${context.runId})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Error posting coverage comment:', error.message);
            }

  backend-coverage-pr-comment:
    name: Backend coverage PR comment
    needs: tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: Server/coverage

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const coveragePath = path.join(process.env.GITHUB_WORKSPACE, 'Server', 'coverage', 'coverage.json');

              if (!fs.existsSync(coveragePath)) {
                console.log('Coverage JSON not found, skipping comment');
                return;
              }

              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const totals = coverage.totals;

              const lineCoverage = ((totals.covered_lines / totals.num_statements) * 100).toFixed(2);
              const branchCoverage = totals.num_branches > 0
                ? ((totals.covered_branches / totals.num_branches) * 100).toFixed(2)
                : 'N/A';

              const comment = `## Backend coverage report

              | Metric | Coverage | Threshold |
              |--------|----------|-----------|
              | Lines | ${lineCoverage}% | 50% (overall) |
              | Branches | ${branchCoverage}% | - |

              ### Module-Specific Thresholds
              - Services: 70% required
              - Routes: 50% required
              - Models: 60% required
              - Utils: 70% required

              [View detailed coverage report](../actions/runs/${context.runId})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Error posting coverage comment:', error.message);
            }
