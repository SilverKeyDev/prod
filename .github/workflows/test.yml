name: Test & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-test:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: Client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Client
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: Client
        run: pnpm test:coverage

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            Client/coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const coveragePath = path.join(process.env.GITHUB_WORKSPACE, 'Client', 'coverage', 'coverage-summary.json');

              if (!fs.existsSync(coveragePath)) {
                console.log('Coverage summary not found, skipping comment');
                return;
              }

              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const total = coverage.total;

              const comment = `## 📊 Frontend Coverage Report

              | Metric | Coverage | Threshold |
              |--------|----------|-----------|
              | Lines | ${total.lines.pct.toFixed(2)}% | 70% (utils/hooks), 50% (features) |
              | Statements | ${total.statements.pct.toFixed(2)}% | 70% (utils/hooks), 50% (features) |
              | Functions | ${total.functions.pct.toFixed(2)}% | 70% (utils/hooks), 50% (features) |
              | Branches | ${total.branches.pct.toFixed(2)}% | 65% (utils/hooks), 45% (features) |

              📁 [View detailed coverage report](../actions/runs/${context.runId})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Error posting coverage comment:', error.message);
            }

  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        working-directory: Server
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create coverage directory
        working-directory: Server
        run: mkdir -p coverage

      # Full suite includes Server/tests/contract (OpenAPI ↔ Pydantic response checks).
      - name: Run tests with coverage
        working-directory: Server
        run: pytest

      - name: Check module-specific coverage thresholds
        working-directory: Server
        run: python scripts/check_coverage_thresholds.py

      - name: Upload backend coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            Server/coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const coveragePath = path.join(process.env.GITHUB_WORKSPACE, 'Server', 'coverage', 'coverage.json');

              if (!fs.existsSync(coveragePath)) {
                console.log('Coverage JSON not found, skipping comment');
                return;
              }

              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const totals = coverage.totals;

              const lineCoverage = ((totals.covered_lines / totals.num_statements) * 100).toFixed(2);
              const branchCoverage = totals.num_branches > 0
                ? ((totals.covered_branches / totals.num_branches) * 100).toFixed(2)
                : 'N/A';

              const comment = `## 🐍 Backend Coverage Report

              | Metric | Coverage | Threshold |
              |--------|----------|-----------|
              | Lines | ${lineCoverage}% | 50% (overall) |
              | Branches | ${branchCoverage}% | - |

              ### Module-Specific Thresholds
              - Services: 70% required
              - Routes: 50% required
              - Models: 60% required
              - Utils: 70% required

              📁 [View detailed coverage report](../actions/runs/${context.runId})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Error posting coverage comment:', error.message);
            }

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend tests completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Backend tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
