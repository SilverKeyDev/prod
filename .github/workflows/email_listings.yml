name: Email Listings

on:
  workflow_dispatch:

env:
  REGION: us-east-2

permissions:
  contents: read

jobs:
  email-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: utility-last-logged-in
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update -y >/dev/null 2>&1 && sudo apt-get install -y jq >/dev/null 2>&1

      - name: Load app env from AWS Secrets Manager (custom, no prefixes)
        shell: bash
        run: |
          set -euo pipefail

          fetch_json () {
            local id="$1"
            aws secretsmanager get-secret-value \
              --secret-id "$id" \
              --query SecretString \
              --output text 2>/dev/null || echo '{}'
          }

          export_if_present () {
            local json="$1"
            local jkey="$2"
            local envname="$3"
            local val
            val="$(jq -er --arg k "$jkey" '.[$k] // empty' <<<"$json" 2>/dev/null || true)"
            if [ -n "${val:-}" ]; then
              printf '%s=%s\n' "$envname" "$val" >> "$GITHUB_ENV"
            fi
          }

          # Mirror env loading used in ci_web.yml
          db_url_json="$(fetch_json db_url)"
          aws_access_json="$(fetch_json AWS_Access)"
          cognito_json="$(fetch_json cognito)"
          gmaps_json="$(fetch_json gmaps)"
          gcal_json="$(fetch_json google_calendar)"
          census_json="$(fetch_json census_api)"
          mapbox_json="$(fetch_json mapbox)"
          openai_json="$(fetch_json openai)"
          perplexity_json="$(fetch_json perplexity)"
          plaid_json="$(fetch_json plaid)"
          serp_json="$(fetch_json serp)"
          rapidapi_json="$(fetch_json rapidapi)"

          export_if_present "$db_url_json" "DATABASE_URL" "DATABASE_URL"

          export_if_present "$aws_access_json" "AWS_ACCESS_KEY_ID" "AWS_ACCESS_KEY_ID"
          export_if_present "$aws_access_json" "AWS_SECRET_ACCESS_KEY" "AWS_SECRET_ACCESS_KEY"

          export_if_present "$cognito_json" "AWS_COGNITO_USER_POOL_ID" "AWS_COGNITO_USER_POOL_ID"
          export_if_present "$cognito_json" "AWS_COGNITO_CLIENT_ID" "AWS_COGNITO_CLIENT_ID"
          export_if_present "$cognito_json" "AWS_COGNITO_CLIENT_SECRET" "AWS_COGNITO_CLIENT_SECRET"

          export_if_present "$gmaps_json" "GOOGLE_MAPS_API_KEY" "GOOGLE_MAPS_API_KEY"

          export_if_present "$gcal_json" "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_ID"
          export_if_present "$gcal_json" "GOOGLE_CALENDAR_SECRET" "GOOGLE_CALENDAR_SECRET"

          export_if_present "$census_json" "CENSUS_API_KEY" "CENSUS_API_KEY"
          export_if_present "$mapbox_json" "MAPBOX_API_KEY" "MAPBOX_API_KEY"

          export_if_present "$openai_json" "OPENAI_KEY" "OPENAI_KEY"
          export_if_present "$perplexity_json" "PERPLEXITY_API_KEY" "PERPLEXITY_API_KEY"

          export_if_present "$plaid_json" "PLAID_SANDBOX_KEY" "PLAID_SANDBOX_KEY"
          export_if_present "$plaid_json" "PLAID_SECRET" "PLAID_SECRET"
          export_if_present "$plaid_json" "VITE_PLAID_CLIENT_ID" "VITE_PLAID_CLIENT_ID"

          export_if_present "$serp_json" "SERP_API" "SERP_API"
          export_if_present "$rapidapi_json" "RAPIDAPI_KEY" "RAPIDAPI_KEY"

      - name: Validate required envs
        shell: bash
        run: |
          set -euo pipefail
          for v in DATABASE_URL; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required env: $v" >&2
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Server/requirements.txt

      - name: Install server dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          pip install -r Server/requirements.txt

      - name: Run last_logged_in report
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PYTHONPATH: Server
        run: |
          set -euo pipefail
          python - <<'PY' | tee last_logged_in_out.txt
          import json
          import os
          from flask import Flask  # minimal app to bind SQLAlchemy
          from app import db  # type: ignore
          from app.services.email.last_logged_in import (  # type: ignore
              get_recently_logged_in_users_with_preferences,
          )

          # Create a minimal Flask app and bind the database without registering routes
          app = Flask(__name__)
          app.config['SQLALCHEMY_DATABASE_URI'] = os.environ['DATABASE_URL']
          app.config['SQLALCHEMY_TRACK_MODIFICATIONS'] = False
          db.init_app(app)

          with app.app_context():
              users = get_recently_logged_in_users_with_preferences() or []

          print("Found", len(users), "recently logged-in users with preferences.")
          print(json.dumps(users, indent=2))
          PY
          {
            echo "### Last Logged In Report"
            echo ""
            echo '```json'
            cat last_logged_in_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run polygon search for all users (throttled)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PYTHONPATH: Server
          RAPIDAPI_KEY: ${{ env.RAPIDAPI_KEY || '' }}
          GOOGLE_MAPS_API_KEY: ${{ env.GOOGLE_MAPS_API_KEY || '' }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CALENDAR_SECRET: ${{ env.GOOGLE_CALENDAR_SECRET || '' }}
          AWS_COGNITO_USER_POOL_ID: ${{ env.AWS_COGNITO_USER_POOL_ID }}
          AWS_COGNITO_CLIENT_ID: ${{ env.AWS_COGNITO_CLIENT_ID }}
          AWS_REGION: ${{ env.REGION }}
          # Tuning knobs (optional)
          POLY_SEARCH_PAUSE_SECONDS: "5.0"
          POLY_SEARCH_PER_BUCKET_PAGES: "5"
          # POLY_SEARCH_USER_LIMIT: "50"  # uncomment to cap for testing
        run: |
          set -euo pipefail
          python - <<'PY' | tee poly_search_out.txt
          import os
          from app.services.search.run_polygon_for_all_users import run_polygon_search_for_all_users

          pause = float(os.getenv('POLY_SEARCH_PAUSE_SECONDS', '1.0'))
          pages = int(os.getenv('POLY_SEARCH_PER_BUCKET_PAGES', '5'))
          limit_env = os.getenv('POLY_SEARCH_USER_LIMIT')
          limit = int(limit_env) if (limit_env and limit_env.isdigit()) else None

          summary = run_polygon_search_for_all_users(
              pause_seconds=pause,
              per_bucket_pages=pages,
              user_limit=limit,
          )
          print("Polygon search summary:", {k: (v if k != 'errors' else f"{len(v)} errors") for k, v in summary.items()})
          PY
          {
            echo "### Polygon Search Summary"
            echo ""
            echo '```'
            cat poly_search_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
