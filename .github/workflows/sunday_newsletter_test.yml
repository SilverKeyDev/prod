name: Sunday Newsletter (Test - Single Email)

on:
  schedule:
    # Run every Sunday at 6am Eastern (11am UTC)
    - cron: "0 11 * * 0"
  workflow_dispatch:

env:
  REGION: us-east-2

permissions:
  contents: read

jobs:
  email-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: email-listings-test
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large, unused SDKs commonly preinstalled on GitHub runners
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android

          echo "Disk space after cleanup:"
          df -h

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update -y >/dev/null 2>&1 && sudo apt-get install -y jq >/dev/null 2>&1

      - name: Load app env from AWS Secrets Manager (custom, no prefixes)
        shell: bash
        run: |
          set -euo pipefail

          fetch_json () {
            local id="$1"
            aws secretsmanager get-secret-value \
              --secret-id "$id" \
              --query SecretString \
              --output text 2>/dev/null || echo '{}'
          }

          export_if_present () {
            local json="$1"
            local jkey="$2"
            local envname="$3"
            local val
            val="$(jq -er --arg k "$jkey" '.[$k] // empty' <<<"$json" 2>/dev/null || true)"
            if [ -n "${val:-}" ]; then
              printf '%s=%s\n' "$envname" "$val" >> "$GITHUB_ENV"
            fi
          }

          # db_url secret: plaintext, JSON string, or JSON object (often key "db_url" not DATABASE_URL).
          export_database_url_from_db_secret () {
            local json="$1"
            [ -z "$json" ] || [ "$json" = "{}" ] && return 0
            local val=""
            if jq -e . >/dev/null 2>&1 <<<"$json"; then
              val="$(jq -r '
                if type == "string" then .
                elif type == "object" then
                  [
                    .DATABASE_URL, .database_url, .db_url, .url,
                    .connection_string, .connectionString, .uri, .URI
                  ] | map(select(. != null and (. | type == "string") and (. != ""))) | first // empty
                else empty end
              ' <<<"$json" 2>/dev/null || true)"
            else
              # AWS "plaintext" secret: raw connection string, not JSON.
              val="$(printf '%s' "$json" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            fi
            [ -z "$val" ] || [ "$val" = "null" ] && return 0
            {
              echo "DATABASE_URL<<DB_URL_EOF"
              printf '%s\n' "$val"
              echo "DB_URL_EOF"
            } >> "$GITHUB_ENV"
          }

          # Mirror env loading used in ci_web.yml
          db_url_json="$(fetch_json db_url)"
          aws_access_json="$(fetch_json AWS_Access)"
          cognito_json="$(fetch_json cognito)"
          gmaps_json="$(fetch_json gmaps)"
          gcal_json="$(fetch_json google_calendar)"
          census_json="$(fetch_json census_api)"
          mapbox_json="$(fetch_json mapbox)"
          openai_json="$(fetch_json openai)"
          perplexity_json="$(fetch_json perplexity)"
          plaid_json="$(fetch_json plaid)"
          serp_json="$(fetch_json serp)"
          slipstream_json="$(fetch_json slipstream)"

          export_database_url_from_db_secret "$db_url_json"

          export_if_present "$aws_access_json" "AWS_ACCESS_KEY_ID" "AWS_ACCESS_KEY_ID"
          export_if_present "$aws_access_json" "AWS_SECRET_ACCESS_KEY" "AWS_SECRET_ACCESS_KEY"

          export_if_present "$cognito_json" "AWS_COGNITO_USER_POOL_ID" "AWS_COGNITO_USER_POOL_ID"
          export_if_present "$cognito_json" "AWS_COGNITO_CLIENT_ID" "AWS_COGNITO_CLIENT_ID"
          export_if_present "$cognito_json" "AWS_COGNITO_CLIENT_SECRET" "AWS_COGNITO_CLIENT_SECRET"

          export_if_present "$gmaps_json" "GOOGLE_MAPS_API_KEY" "GOOGLE_MAPS_API_KEY"

          export_if_present "$gcal_json" "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_ID"
          export_if_present "$gcal_json" "GOOGLE_CALENDAR_SECRET" "GOOGLE_CALENDAR_SECRET"

          export_if_present "$census_json" "CENSUS_API_KEY" "CENSUS_API_KEY"
          export_if_present "$mapbox_json" "MAPBOX_API_KEY" "MAPBOX_API_KEY"

          export_if_present "$openai_json" "OPENAI_KEY" "OPENAI_KEY"
          export_if_present "$perplexity_json" "PERPLEXITY_API_KEY" "PERPLEXITY_API_KEY"

          export_if_present "$plaid_json" "PLAID_SANDBOX_KEY" "PLAID_SANDBOX_KEY"
          export_if_present "$plaid_json" "PLAID_SECRET" "PLAID_SECRET"
          export_if_present "$plaid_json" "EXPO_PUBLIC_PLAID_CLIENT_ID" "EXPO_PUBLIC_PLAID_CLIENT_ID"

          export_if_present "$serp_json" "SERP_API" "SERP_API"
          export_if_present "$slipstream_json" "SLIPSTREAM_PRIVATE" "SLIPSTREAM_PRIVATE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Caching pip can increase disk usage; you can re-enable if needed later
          cache: "pip"
          cache-dependency-path: Server/requirements/runtime.txt

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: Client/pnpm-lock.yaml

      - name: Install server dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          # Use --no-cache-dir to avoid filling disk with pip cache
          pip install --no-cache-dir -r Server/requirements/runtime.txt
          pip install --no-cache-dir boto3 >/dev/null

      - name: Install frontend dependencies
        working-directory: Client
        run: |
          set -euo pipefail
          echo "Installing frontend dependencies with pnpm..."
          echo "pnpm version: $(pnpm --version)"
          echo "Lockfile exists: $([ -f pnpm-lock.yaml ] && echo 'yes' || echo 'no')"
          pnpm install --frozen-lockfile

      - name: Run email listings orchestrator (search + email)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PYTHONPATH: Server
          AWS_REGION: ${{ env.REGION }}
          # Optional knobs for throttling and pagination
          POLY_SEARCH_PAUSE_SECONDS: "5.0"
          POLY_SEARCH_PER_BUCKET_PAGES: "5"
          EMAIL_MAX_ITEMS_PER_USER: "10"
          # Enable HTML email rendering (default: true)
          EMAIL_USE_HTML: "true"
          # Test mode: only send to this email address
          TEST_EMAIL: "walzerjayce@gmail.com"
        run: |
          set -euo pipefail
          echo "Starting orchestrator..."
          echo "Node.js version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"
          echo "Checking email render script availability..."
          test -f Client/packages/email-templates/render-email.ts && echo "✓ Render script found" || echo "✗ Render script missing"
          python Server/app/services/email/run_email_listings.py | tee orchestrator_out.txt
          {
            echo "### Email Listings Orchestrator"
            echo ""
            echo '```'
            cat orchestrator_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log - Completed workflow
        run: |
          {
            echo "### Completed"
            echo "Email listings workflow completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"
