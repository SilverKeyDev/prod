name: Prod Deploy - Web (EC2)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: us-east-2
  REPO: cre
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: prod-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update -y && sudo apt-get install -y jq > /dev/null 2>&1

      - name: Snapshot env (before secrets)
        run: |
          printenv | cut -d= -f1 | sort > /tmp/env_before

      - name: Load app env from AWS Secrets Manager (custom, no prefixes)
        shell: bash
        run: |
          set -euo pipefail

          fetch_json () {
            local id="$1"
            aws secretsmanager get-secret-value \
              --secret-id "$id" \
              --query SecretString \
              --output text
          }

          db_url_json="$(fetch_json db_url || echo '{}')"
          aws_access_json="$(fetch_json AWS_Access || echo '{}')"
          cognito_json="$(fetch_json cognito || echo '{}')"
          gmaps_json="$(fetch_json gmaps || echo '{}')"
          gcal_json="$(fetch_json google_calendar || echo '{}')"
          census_json="$(fetch_json census_api || echo '{}')"
          mapbox_json="$(fetch_json mapbox || echo '{}')"
          openai_json="$(fetch_json openai || echo '{}')"
          perplexity_json="$(fetch_json perplexity || echo '{}')"
          plaid_json="$(fetch_json plaid || echo '{}')"
          serp_json="$(fetch_json serp || echo '{}')"
          rapidapi_json="$(fetch_json rapidapi || echo '{}')"

          export_if_present () {
            local json="$1"
            local jkey="$2"
            local envname="$3"
            local val
            val="$(jq -er --arg k "$jkey" '.[$k] // empty' <<<"$json" || true)"
            if [ -n "${val:-}" ]; then
              printf '%s=%s\n' "$envname" "$val" >> "$GITHUB_ENV"
            fi
          }

          export_if_present "$db_url_json" "DATABASE_URL" "DATABASE_URL"

          export_if_present "$aws_access_json" "AWS_ACCESS_KEY_ID" "AWS_ACCESS_KEY_ID"
          export_if_present "$aws_access_json" "AWS_SECRET_ACCESS_KEY" "AWS_SECRET_ACCESS_KEY"

          export_if_present "$cognito_json" "AWS_COGNITO_USER_POOL_ID" "AWS_COGNITO_USER_POOL_ID"
          export_if_present "$cognito_json" "AWS_COGNITO_CLIENT_ID" "AWS_COGNITO_CLIENT_ID"
          export_if_present "$cognito_json" "AWS_COGNITO_CLIENT_SECRET" "AWS_COGNITO_CLIENT_SECRET"

          export_if_present "$gmaps_json" "GOOGLE_MAPS_API_KEY" "GOOGLE_MAPS_API_KEY"

          export_if_present "$gcal_json" "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_ID"
          export_if_present "$gcal_json" "GOOGLE_CALENDAR_SECRET" "GOOGLE_CALENDAR_SECRET"

          export_if_present "$census_json" "CENSUS_API_KEY" "CENSUS_API_KEY"
          export_if_present "$mapbox_json" "MAPBOX_API_KEY" "MAPBOX_API_KEY"

          export_if_present "$openai_json" "OPENAI_KEY" "OPENAI_KEY"
          export_if_present "$perplexity_json" "PERPLEXITY_API_KEY" "PERPLEXITY_API_KEY"

          export_if_present "$plaid_json" "PLAID_SANDBOX_KEY" "PLAID_SANDBOX_KEY"
          export_if_present "$plaid_json" "PLAID_SECRET" "PLAID_SECRET"
          export_if_present "$plaid_json" "VITE_PLAID_CLIENT_ID" "VITE_PLAID_CLIENT_ID"

          export_if_present "$serp_json" "SERP_API" "SERP_API"
          export_if_present "$rapidapi_json" "RAPIDAPI_KEY" "RAPIDAPI_KEY"

      - name: List env keys added from Secrets Manager (names only)
        run: |
          printenv | cut -d= -f1 | sort > /tmp/env_after_secrets
          echo "New environment variable keys loaded (no values):"
          if [ -f /tmp/env_before ]; then
            comm -13 /tmp/env_before /tmp/env_after_secrets || true
          else
            echo "No /tmp/env_before; skipping env diff."
          fi

      - name: Set up Docker Buildx (container driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push to ECR (no local load)
        env:
          VITE_GOOGLE_MAPS_ID: ${{ secrets.VITE_GOOGLE_MAPS_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_PLAID_CLIENT_ID: ${{ secrets.VITE_PLAID_CLIENT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

          CACHE_REF="$ACCOUNT_ID.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.REPO }}:buildcache"
          IMAGE_REF="$ACCOUNT_ID.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.REPO }}:${{ env.IMAGE_TAG }}"

          docker system prune -f || true

          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.web \
            --build-arg VITE_GOOGLE_MAPS_ID="$VITE_GOOGLE_MAPS_ID" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            --build-arg VITE_PLAID_CLIENT_ID="$VITE_PLAID_CLIENT_ID" \
            --tag "$IMAGE_REF" \
            --cache-from type=registry,ref="$CACHE_REF" \
            --cache-to type=registry,ref="$CACHE_REF",mode=max \
            --push \
            .

      - name: Prune Buildx cache (safe)
        run: |
          docker buildx prune -af || true
          docker system df || true

      - name: SSH into EC2 and Deploy Container + Copy Frontend
        uses: appleboy/ssh-action@v1.0.0
        env:
          AWS_REGION: ${{ env.REGION }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_COGNITO_USER_POOL_ID: ${{ env.AWS_COGNITO_USER_POOL_ID }}
          AWS_COGNITO_CLIENT_ID: ${{ env.AWS_COGNITO_CLIENT_ID }}
          AWS_COGNITO_CLIENT_SECRET: ${{ env.AWS_COGNITO_CLIENT_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ env.GOOGLE_MAPS_API_KEY }}
          GOOGLE_CALENDAR_SECRET: ${{ env.GOOGLE_CALENDAR_SECRET }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          CENSUS_API_KEY: ${{ env.CENSUS_API_KEY }}
          MAPBOX_API_KEY: ${{ env.MAPBOX_API_KEY }}
          OPENAI_KEY: ${{ env.OPENAI_KEY }}
          PERPLEXITY_API_KEY: ${{ env.PERPLEXITY_API_KEY }}
          PLAID_SANDBOX_KEY: ${{ env.PLAID_SANDBOX_KEY }}
          PLAID_SECRET: ${{ env.PLAID_SECRET }}
          VITE_PLAID_CLIENT_ID: ${{ env.VITE_PLAID_CLIENT_ID }}
          SERP_API: ${{ env.SERP_API }}
          RAPIDAPI_KEY: ${{ env.RAPIDAPI_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: >
            AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,
            DATABASE_URL,
            AWS_COGNITO_USER_POOL_ID,AWS_COGNITO_CLIENT_ID,AWS_COGNITO_CLIENT_SECRET,
            GOOGLE_MAPS_API_KEY,GOOGLE_CALENDAR_SECRET,GOOGLE_CLIENT_ID,
            CENSUS_API_KEY,MAPBOX_API_KEY,OPENAI_KEY,PERPLEXITY_API_KEY,
            PLAID_SANDBOX_KEY,PLAID_SECRET,VITE_PLAID_CLIENT_ID,
            SERP_API,RAPIDAPI_KEY
          script: |
            set -e

            echo "🕒 $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting EC2 deployment..."
            REGION="$AWS_REGION"
            REPO="cre"
            IMAGE_TAG="latest"

            # --- Ensure Docker is installed AND running BEFORE any docker command ---
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update -y > /dev/null 2>&1
              timeout 3m sudo apt-get install -y docker.io unzip curl > /dev/null 2>&1 || true
            fi
            sudo systemctl enable --now docker >/dev/null 2>&1 || sudo service docker start || true

            if ! docker info >/dev/null 2>&1; then
              echo "❌ Docker daemon not running; attempted to start it but failed."
              sudo journalctl -u docker -n 200 --no-pager || true
              exit 1
            fi

            # Ensure Buildx (avoid legacy builder warnings)
            docker buildx version || (wget -qO- https://get.docker.com | sh && docker buildx create --use) || true

            # --- Diagnostics & cleanup (guarded) ---
            echo "🧹 Starting comprehensive disk cleanup..."
            echo "📊 Disk usage before cleanup:"
            df -h || true
            docker system df || true
            sudo du -xh /var/lib/docker | sort -h | tail -40 || true

            echo "🐳 Docker containers status:"
            sudo docker ps -a || true

            echo "🗑️ Cleaning Docker resources..."
            sudo docker rm -f $(docker ps -aq) 2>/dev/null || true
            sudo docker system prune -af --volumes || true
            sudo docker builder prune -af || true
            sudo docker image prune -af || true
            sudo docker volume prune -f || true

            echo "🧽 Cleaning system caches..."
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* || true
            sudo journalctl --vacuum-time=3d || true
            sudo rm -rf ~/.cache /root/.cache /tmp/* /var/tmp/* || true

            echo "📊 Disk usage after cleanup:"
            df -h || true
            docker system df || true

            # --- AWS CLI (if missing) ---
            if ! aws --version | grep -q aws-cli; then
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip && sudo ./aws/install > /dev/null 2>&1 && rm -rf aws awscliv2.zip
            fi

            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text --region "$REGION")
            IMAGE="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG"

            aws ecr get-login-password --region "$REGION" \
              | sudo docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com" 2>/dev/null

            sudo docker image prune -f || true
            sudo docker pull "$IMAGE"
            sudo docker image prune -f || true

            # Stop/remove old containers if present
            for name in cre_app cre_worker; do
              sudo docker rm -f "$name" 2>/dev/null || true
            done

            # Redis
            sudo docker rm -f redis 2>/dev/null || true
            sudo docker run -d --name redis \
              -p 6379:6379 \
              --health-cmd="redis-cli ping || exit 1" \
              --health-interval=30s --health-timeout=10s --health-retries=3 --health-start-period=30s \
              redis:7-alpine

            # App
            sudo docker run -d --name cre_app \
              -p 5000:5000 \
              --health-cmd="curl -fsS http://localhost:5000/healthz || exit 1" \
              --health-interval=30s --health-timeout=10s --health-retries=3 --health-start-period=40s \
              -e AWS_REGION="${AWS_REGION}" \
              -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" \
              -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e AWS_COGNITO_USER_POOL_ID="${AWS_COGNITO_USER_POOL_ID}" \
              -e AWS_COGNITO_CLIENT_ID="${AWS_COGNITO_CLIENT_ID}" \
              -e AWS_COGNITO_CLIENT_SECRET="${AWS_COGNITO_CLIENT_SECRET}" \
              -e GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY}" \
              -e GOOGLE_CALENDAR_SECRET="${GOOGLE_CALENDAR_SECRET}" \
              -e GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
              -e CENSUS_API_KEY="${CENSUS_API_KEY}" \
              -e MAPBOX_API_KEY="${MAPBOX_API_KEY}" \
              -e OPENAI_KEY="${OPENAI_KEY}" \
              -e PERPLEXITY_API_KEY="${PERPLEXITY_API_KEY}" \
              -e PLAID_SANDBOX_KEY="${PLAID_SANDBOX_KEY}" \
              -e PLAID_SECRET="${PLAID_SECRET}" \
              -e VITE_PLAID_CLIENT_ID="${VITE_PLAID_CLIENT_ID}" \
              -e SERP_API="${SERP_API}" \
              -e RAPIDAPI_KEY="${RAPIDAPI_KEY}" \
              "$IMAGE"

            # Worker (correct Celery target: :celery)
            sudo docker run -d --name cre_worker \
              --link redis:redis \
              --health-cmd="celery -A app.celery.celery_worker:celery inspect ping || exit 1" \
              --health-interval=60s --health-timeout=30s --health-retries=3 --health-start-period=60s \
              -e AWS_REGION="${AWS_REGION}" \
              -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" \
              -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e AWS_COGNITO_USER_POOL_ID="${AWS_COGNITO_USER_POOL_ID}" \
              -e AWS_COGNITO_CLIENT_ID="${AWS_COGNITO_CLIENT_ID}" \
              -e AWS_COGNITO_CLIENT_SECRET="${AWS_COGNITO_CLIENT_SECRET}" \
              -e GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY}" \
              -e GOOGLE_CALENDAR_SECRET="${GOOGLE_CALENDAR_SECRET}" \
              -e GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
              -e CENSUS_API_KEY="${CENSUS_API_KEY}" \
              -e MAPBOX_API_KEY="${MAPBOX_API_KEY}" \
              -e OPENAI_KEY="${OPENAI_KEY}" \
              -e PERPLEXITY_API_KEY="${PERPLEXITY_API_KEY}" \
              -e PLAID_SANDBOX_KEY="${PLAID_SANDBOX_KEY}" \
              -e PLAID_SECRET="${PLAID_SECRET}" \
              -e VITE_PLAID_CLIENT_ID="${VITE_PLAID_CLIENT_ID}" \
              -e SERP_API="${SERP_API}" \
              -e RAPIDAPI_KEY="${RAPIDAPI_KEY}" \
              "$IMAGE" \
              celery -A app.celery.celery_worker:celery worker --loglevel=info

            # (Optional) export built frontend
            sudo rm -rf /var/www/html/* || true
            sudo docker cp cre_app:/app/Client/dist/. /var/www/html/ || true
            sudo chown -R www-data:www-data /var/www/html || true

            # Health checks
            echo "cre_app health:"
            sudo docker inspect --format='{{json .State.Health}}' cre_app || true
            echo "cre_worker health:"
            sudo docker inspect --format='{{json .State.Health}}' cre_worker || true
            echo "redis health:"
            sudo docker inspect --format='{{json .State.Health}}' redis || true

      - name: Final cleanup (safe)
        if: always()
        run: |
          echo "🧹 Final GitHub Actions runner cleanup..."
          docker buildx prune -af || true
          docker system prune -af --volumes || true
          docker builder prune -af || true
          docker image prune -af || true
          docker volume prune -f || true

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* || true
          sudo journalctl --vacuum-time=1d || true
          sudo rm -rf ~/.cache /root/.cache /tmp/* /var/tmp/* || true

          echo "📊 Final disk usage:"
          df -h
          docker system df || true