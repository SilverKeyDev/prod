name: Prod Deploy - Web (EC2)

on:
  workflow_dispatch:

env:
  REGION: us-east-2
  REPO: cre
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Set up Docker Buildx (container driver)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # Free up disk on runner, but DO NOT prune Docker images (keeps action images like appleboy)
      - name: Free up disk space on runner
        run: |
          echo "🧹 Freeing disk on runner..."
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android || true
          # Only clear buildx cache; avoid docker system/image prune here
          docker buildx prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          df -h

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.1.2

      - name: Build & push to ECR
        env:
          # GitHub Actions: add repository secrets EXPO_PUBLIC_* (Plaid Link / Maps / OAuth client IDs for the web bundle).
          EXPO_PUBLIC_GOOGLE_MAPS_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_ID }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_PLAID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_PLAID_CLIENT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

          IMAGE_TAG="${IMAGE_TAG:-latest}"
          BASE_REF="$ACCOUNT_ID.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.REPO }}"
          IMAGE_REF="$BASE_REF:$IMAGE_TAG"
          CACHE_REF="$BASE_REF:buildcache"
          WEB_PROD_REF="$BASE_REF:web-prod"

          export DOCKER_BUILDKIT=1
          export BUILDKIT_PROGRESS=plain
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.web \
            --build-arg EXPO_PUBLIC_GOOGLE_MAPS_ID="$EXPO_PUBLIC_GOOGLE_MAPS_ID" \
            --build-arg EXPO_PUBLIC_GOOGLE_CLIENT_ID="$EXPO_PUBLIC_GOOGLE_CLIENT_ID" \
            --build-arg EXPO_PUBLIC_PLAID_CLIENT_ID="$EXPO_PUBLIC_PLAID_CLIENT_ID" \
            --tag "$IMAGE_REF" \
            --tag "$WEB_PROD_REF" \
            --cache-from type=registry,ref="$CACHE_REF" \
            --cache-to type=registry,ref="$CACHE_REF",mode=max \
            --push \
            .

      - name: Prune Buildx cache (safe)
        run: |
          docker buildx prune -af >/dev/null 2>&1 || true
          docker system df || true

      - name: Copy deploy scripts to EC2
        if: ${{ success() }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".github/scripts/ec2-deploy.sh,.github/scripts/_secrets-env.sh"
          target: "/tmp/deploy/"
          strip_components: 2

      # Load optional repo variable DB_URL_SECRET_ID without ${{ vars.* }} (IDE language service flags unknown var names).
      - name: Load DB_URL_SECRET_ID from repository variables
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/variables/DB_URL_SECRET_ID"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          if [ "$code" = "200" ]; then
            value="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("value") or "")' < "$tmp")"
            printf '%s\n' "DB_URL_SECRET_ID=${value}" >> "$GITHUB_ENV"
          else
            echo "DB_URL_SECRET_ID=" >> "$GITHUB_ENV"
          fi
          rm -f "$tmp"

      - name: SSH into EC2 and Deploy Container + Copy Frontend
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1.0.0
        env:
          ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
          AWS_REGION: ${{ env.REGION }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          REPO: ${{ env.REPO }}
          DB_URL_SECRET_ID: ${{ env.DB_URL_SECRET_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ACCOUNT_ID,AWS_REGION,IMAGE_TAG,REPO,DB_URL_SECRET_ID
          script: |
            mkdir -p /tmp/deploy
            chmod +x /tmp/deploy/ec2-deploy.sh
            bash /tmp/deploy/ec2-deploy.sh

      - name: Final cleanup (safe)
        if: always()
        run: |
          echo "🧹 Final GitHub Actions runner cleanup..."
          docker buildx prune -af >/dev/null 2>&1 || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          docker image prune -af >/dev/null 2>&1 || true
          docker volume prune -f >/dev/null 2>&1 || true

          sudo apt-get clean >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* >/dev/null 2>&1 || true
          sudo journalctl --vacuum-time=1d >/dev/null 2>&1 || true
          sudo rm -rf ~/.cache /root/.cache /tmp/* /var/tmp/* >/dev/null 2>&1 || true

          echo "📊 Final disk usage:"
          df -h
          docker system df || true
