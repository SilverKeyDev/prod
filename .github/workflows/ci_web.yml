name: Prod Deploy - Web (EC2)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional existing immutable ECR image tag to deploy, e.g. prior 12-char git SHA for rollback"
        required: false
        type: string

env:
  REGION: us-east-2
  REPO: cre

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set immutable image tag (git SHA)
        run: |
          set -euo pipefail
          REQUESTED_IMAGE_TAG="${{ github.event.inputs.image_tag || '' }}"
          if [ -n "$REQUESTED_IMAGE_TAG" ]; then
            IMAGE_TAG="$REQUESTED_IMAGE_TAG"
            echo "Rollback/redeploy requested for existing image tag: $IMAGE_TAG"
          else
            IMAGE_TAG="${GITHUB_SHA::12}"
            echo "Deploy image tag: $IMAGE_TAG (from ${GITHUB_SHA})"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Set up Docker Buildx (container driver)
        if: ${{ github.event.inputs.image_tag == '' }}
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # Free up disk on runner, but DO NOT prune Docker images (keeps action images like appleboy)
      - name: Free up disk space on runner
        run: |
          echo "🧹 Freeing disk on runner..."
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android || true
          # Only clear buildx cache; avoid docker system/image prune here
          docker buildx prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          df -h

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.1.5

      - name: Assert bundle build secrets
        if: ${{ github.event.inputs.image_tag == '' }}
        env:
          # GitHub Actions: repository secrets EXPO_PUBLIC_* (Maps / Plaid / OAuth / PostHog for the web bundle).
          EXPO_PUBLIC_GOOGLE_MAPS_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_ID }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_PLAID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_PLAID_CLIENT_ID }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
        run: node Client/scripts/assert-github-bundle-secrets.mjs Client

      - name: Build & push to ECR
        if: ${{ github.event.inputs.image_tag == '' }}
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_ID }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_PLAID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_PLAID_CLIENT_ID }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

          IMAGE_TAG="${IMAGE_TAG:?IMAGE_TAG must be set (git SHA)}"
          BASE_REF="$ACCOUNT_ID.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.REPO }}"
          IMAGE_REF="$BASE_REF:$IMAGE_TAG"
          CACHE_REF="$BASE_REF:buildcache"
          WEB_PROD_REF="$BASE_REF:web-prod"

          export DOCKER_BUILDKIT=1
          export BUILDKIT_PROGRESS=plain
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.web \
            --target backend \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg EXPO_PUBLIC_GOOGLE_MAPS_ID="$EXPO_PUBLIC_GOOGLE_MAPS_ID" \
            --build-arg EXPO_PUBLIC_GOOGLE_CLIENT_ID="$EXPO_PUBLIC_GOOGLE_CLIENT_ID" \
            --build-arg EXPO_PUBLIC_PLAID_CLIENT_ID="$EXPO_PUBLIC_PLAID_CLIENT_ID" \
            --build-arg EXPO_PUBLIC_POSTHOG_KEY="$EXPO_PUBLIC_POSTHOG_KEY" \
            --tag "$IMAGE_REF" \
            --tag "$WEB_PROD_REF" \
            --cache-from type=registry,ref="$CACHE_REF" \
            --cache-to type=registry,ref="$CACHE_REF",mode=max \
            --push \
            .

          IMAGE_DIGEST="$(aws ecr describe-images \
            --region "${{ env.REGION }}" \
            --repository-name "${{ env.REPO }}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "ERROR: Could not resolve ECR digest for tag ${IMAGE_TAG}" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "Pushed $IMAGE_REF ($IMAGE_DIGEST)"

      - name: Resolve existing rollback image digest
        if: ${{ github.event.inputs.image_tag != '' }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          IMAGE_TAG="${IMAGE_TAG:?IMAGE_TAG must be set}"
          IMAGE_DIGEST="$(aws ecr describe-images \
            --region "${{ env.REGION }}" \
            --repository-name "${{ env.REPO }}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "ERROR: Could not resolve ECR digest for existing tag ${IMAGE_TAG}" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "Resolved existing image tag $IMAGE_TAG ($IMAGE_DIGEST)"

      - name: Verify production image CMD (gunicorn, not migrate)
        run: |
          set -euo pipefail
          ACCOUNT_ID="${ACCOUNT_ID:?}"
          IMAGE_TAG="${IMAGE_TAG:?}"
          IMAGE_REF="${ACCOUNT_ID}.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.REPO }}:${IMAGE_TAG}"
          docker pull "$IMAGE_REF" >/dev/null
          CMD="$(docker image inspect --format='{{json .Config.Cmd}}' "$IMAGE_REF")"
          ENTRYPOINT="$(docker image inspect --format='{{json .Config.Entrypoint}}' "$IMAGE_REF")"
          echo "Image CMD: $CMD"
          echo "Image Entrypoint: $ENTRYPOINT"
          if ! echo "$CMD" | grep -qE 'gunicorn|gunicorn-entrypoint'; then
            echo "ERROR: Image CMD does not include gunicorn — build must use Dockerfile.web --target backend (migrate target runs flask db upgrade and exits)." >&2
            exit 1
          fi
          if echo "$CMD" | grep -qE 'flask|db upgrade'; then
            echo "ERROR: Image CMD looks like a migration-only image." >&2
            exit 1
          fi
          echo "✅ Production image uses gunicorn (backend target)"

      - name: Prune Buildx cache (safe)
        run: |
          docker buildx prune -af >/dev/null 2>&1 || true
          docker system df || true

      - name: Copy deploy scripts to EC2
        if: ${{ success() }}
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".github/scripts/ec2-deploy.sh,.github/scripts/_secrets-env.sh"
          target: "/tmp/deploy/"
          strip_components: 2

      # Load optional repo variable DB_URL_SECRET_ID without ${{ vars.* }} (IDE language service flags unknown var names).
      - name: Load DB_URL_SECRET_ID from repository variables
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/variables/DB_URL_SECRET_ID"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          if [ "$code" = "200" ]; then
            value="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("value") or "")' < "$tmp")"
            printf '%s\n' "DB_URL_SECRET_ID=${value}" >> "$GITHUB_ENV"
          else
            echo "DB_URL_SECRET_ID=" >> "$GITHUB_ENV"
          fi
          rm -f "$tmp"

      - name: SSH into EC2 and Deploy Container + Copy Frontend
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
          AWS_REGION: ${{ env.REGION }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          IMAGE_DIGEST: ${{ env.IMAGE_DIGEST }}
          REPO: ${{ env.REPO }}
          DB_URL_SECRET_ID: ${{ env.DB_URL_SECRET_ID }}
          DEPLOY_DEBUG: "1"
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ACCOUNT_ID,AWS_REGION,IMAGE_TAG,IMAGE_DIGEST,REPO,DB_URL_SECRET_ID,DEPLOY_DEBUG
          script: |
            mkdir -p /tmp/deploy
            chmod +x /tmp/deploy/ec2-deploy.sh
            bash /tmp/deploy/ec2-deploy.sh

      - name: Final cleanup (safe)
        if: always()
        run: |
          echo "🧹 Final GitHub Actions runner cleanup..."
          docker buildx prune -af >/dev/null 2>&1 || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          docker image prune -af >/dev/null 2>&1 || true
          docker volume prune -f >/dev/null 2>&1 || true

          sudo apt-get clean >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* >/dev/null 2>&1 || true
          sudo journalctl --vacuum-time=1d >/dev/null 2>&1 || true
          sudo rm -rf ~/.cache /root/.cache /tmp/* /var/tmp/* >/dev/null 2>&1 || true

          echo "📊 Final disk usage:"
          df -h
          docker system df || true
