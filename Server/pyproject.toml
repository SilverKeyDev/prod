[tool.ruff]
# Ruff configuration for Python linting
# Exclude markdown files and other non-Python files
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*.md",  # Ignore all markdown files
    "*.mdc",
]

# Line length
line-length = 100

# Target Python version
target-version = "py311"

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T201", # flake8-print (bans print statements - use logger instead)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "UP017",  # datetime.UTC requires Python 3.11+; we use timezone.utc for compatibility
]

# Notebooks are exploratory; allow print() for quick inspection and debugging.
# Lint scripts are CLI tools that intentionally write to stderr for tool output.
[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["T201"]
"app/__init__.py" = ["E402"]
"scripts/lint/lint_*.py" = ["T201"]
"scripts/lint/check_coverage_thresholds.py" = ["T201"]
"scripts/validate-schema-coverage.py" = ["T201"]
"scripts/seed_georgia_forms.py" = ["T201", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Use spaces for indentation
skip-magic-trailing-comma = false
# Line ending
line-ending = "auto"

# --- Pyright: import resolution (catches missing modules); type checking off to avoid 600+ existing issues ---
# pythonVersion: omit so each venv's lib/pythonX.Y/site-packages is used (pin only if you must match CI stubs).
# Lint CI installs requirements/lint.txt (ci.txt + ruff + pyright), not test.txt / torch / full ML stack.
[tool.pyright]
typeCheckingMode = "off"
venvPath = "."
venv = ".venv"
# Run from Server/ so "app" resolves to ./app
reportMissingImports = true
reportMissingModuleSource = true
reportUndefinedVariable = true
exclude = [
    "venv",
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "migrations/versions",
    "tests",
    "app/schemas/generated.py",
]

[tool.pyright.overrides."app/services/research"]
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.pyright.overrides."app/services/search/home_matching"]
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.pyright.overrides."app/services/search/locationPolygon.py"]
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.pyright.overrides."app/services/search/polygon"]
reportMissingImports = "none"
reportMissingModuleSource = "none"

# --- Mypy: Optional gradual type checking ---
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual: enable per-module when ready
ignore_missing_imports = true  # Ignore third-party packages without stubs
exclude = [
    "venv",
    ".venv",
    "migrations/versions",
]

# --- Coverage (pytest-cov / coverage.py): config is read from here, not pytest.ini [coverage:*] ---
[tool.coverage.run]
source = ["app"]
omit = [
    "**/tests/**",
    "**/test_*.py",
    "**/__pycache__/**",
    "**/migrations/**",
    "**/.venv/**",
    "**/venv/**",
    "**/env/**",
    # Legacy duplicate of app/services/search/polygon/locationPolygon.py (unused import path).
    "app/services/search/locationPolygon.py",
]

[tool.coverage.report]
fail_under = 47
skip_covered = false
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "pass",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.coverage.json]
output = "coverage/coverage.json"
# For stricter checking, progressively enable:
# disallow_untyped_defs = true
# disallow_any_unimported = true
# no_implicit_optional = true
