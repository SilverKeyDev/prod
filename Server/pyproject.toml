[tool.ruff]
# Ruff configuration for Python linting
# Exclude markdown files and other non-Python files
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*.md",  # Ignore all markdown files
    "*.mdc",
]

# Line length
line-length = 100

# Target Python version
target-version = "py311"

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T201", # flake8-print (bans print statements - use logger instead)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "UP017",  # datetime.UTC requires Python 3.11+; we use timezone.utc for compatibility
]

# Notebooks are exploratory; allow print() for quick inspection and debugging.
# Lint scripts are CLI tools that intentionally write to stderr for tool output.
[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["T201"]
"scripts/lint_*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Use spaces for indentation
skip-magic-trailing-comma = false
# Line ending
line-ending = "auto"

# --- Pyright: import resolution (catches missing modules); type checking off to avoid 600+ existing issues ---
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "off"
venvPath = "."
venv = ".venv"
# Run from Server/ so "app" resolves to ./app
reportMissingImports = true
reportMissingModuleSource = true
reportUndefinedVariable = true
exclude = ["venv", ".venv", "**/node_modules", "**/__pycache__", "**/.*", "migrations/versions"]
