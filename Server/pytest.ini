[pytest]
# Pytest configuration for SilverKey Server

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add current directory to Python path for imports
pythonpath = .

# Markers (for organizing tests)
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external services)
    slow: Slow tests (take >1 second)
    api: API endpoint tests
    contract: OpenAPI / Pydantic contract tests (tests/contract)
    services: Service layer tests
    models: Model tests
    security: Security-related tests

# Coverage configuration
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Stop on first failure (remove for CI)
    # -x
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (must be defined above)
    --strict-markers
    # Coverage options
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html:coverage/html
    --cov-report=xml:coverage/coverage.xml
    --cov-report=json:coverage/coverage.json
    # Line coverage on app/ (see pyproject [tool.coverage.run] for source/omit).
    # Value reflects the full suite after excluding embedded tests under app/ and dead paths.
    --cov-fail-under=47
    # Disable coverage warnings about missing files
    --no-cov-on-fail

# Coverage runtime/report/html/xml/json live in pyproject.toml [tool.coverage.*]
# (Coverage reads pyproject.toml; [coverage:*] sections here are not applied.)

# Module-specific floors are enforced via scripts/lint/check_coverage_thresholds.py
# (see THRESHOLDS in that script; raise toward higher targets as coverage improves).
