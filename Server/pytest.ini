[pytest]
# Pytest configuration for SilverKey Server

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add current directory to Python path for imports
pythonpath = .

# Markers (for organizing tests)
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external services)
    slow: Slow tests (take >1 second)
    api: API endpoint tests
    contract: OpenAPI / Pydantic contract tests (tests/contract)
    services: Service layer tests
    models: Model tests
    security: Security-related tests

# Coverage configuration
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Stop on first failure (remove for CI)
    # -x
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (must be defined above)
    --strict-markers
    # Coverage options
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html:coverage/html
    --cov-report=xml:coverage/coverage.xml
    --cov-report=json:coverage/coverage.json
    # Coverage thresholds (fail if not met)
    --cov-fail-under=50
    # Show coverage for all files (not just tested ones)
    --cov-branch
    # Disable coverage warnings about missing files
    --no-cov-on-fail

# Coverage branch thresholds by module
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*
    */venv/*
    */.venv/*
    */env/*

[coverage:report]
# Fail if coverage below thresholds
fail_under = 50

# Skip files with 100% coverage in report
skip_covered = False

# Show missing lines in report
show_missing = True

# Precision for coverage percentages
precision = 2

# Exclude lines from coverage
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Debug-only code
    def __repr__
    if self\.debug
    # Raise statements
    raise AssertionError
    raise NotImplementedError
    # Defensive programming
    if __name__ == .__main__.:
    # Type checking blocks
    if TYPE_CHECKING:
    # Abstract methods
    @(abc\.)?abstractmethod
    # Pass statements
    pass
    # Ellipsis
    \.\.\.

[coverage:html]
directory = coverage/html

[coverage:xml]
output = coverage/coverage.xml

[coverage:json]
output = coverage/coverage.json

# Module-specific coverage thresholds
# These are enforced via custom scripts (see scripts/lint/check_coverage_thresholds.py)
#
# Services: 70% coverage required
# - app/services/
#
# Routes: 50% coverage required
# - app/routes/
#
# Models: 60% coverage
# - app/models/
#
# Utils: 70% coverage
# - app/utils/
