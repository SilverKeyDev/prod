[pytest]
# Pytest configuration for SilverKey Server

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add current directory to Python path for imports
pythonpath = . ../scripts

# Markers (for organizing tests)
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external services)
    slow: Slow tests (take >1 second)
    api: API endpoint tests
    contract: OpenAPI / Pydantic contract tests (tests/contract)
    services: Service layer tests
    models: Model tests
    security: Security-related tests

# Coverage configuration
addopts =
    # Avoid import-file mismatch when reorganizing tests (same basename in different dirs).
    --import-mode=importlib
    # Quiet per-test lines; failures still print with --tb=short
    -q
    # Summary of failures/errors/skips (not every passing test)
    -ra
    # Condensed tracebacks (full stacks remain on the failure lines)
    --tb=short
    # Suppress live log noise during the run (failures still show via pytest)
    --log-cli-level=ERROR
    # Strict markers (must be defined above)
    --strict-markers
    # Coverage options (term without per-line "missing"; HTML/XML/JSON for CI artifacts)
    --cov=app
    --cov-report=term:skip-covered
    --cov-report=html:coverage/html
    --cov-report=xml:coverage/coverage.xml
    --cov-report=json:coverage/coverage.json
    # Line coverage on app/ (see pyproject [tool.coverage.run] for source/omit).
    # Value reflects the full suite after excluding embedded tests under app/ and dead paths.
    --cov-fail-under=47
    # Disable coverage warnings about missing files
    --no-cov-on-fail

# Coverage runtime/report/html/xml/json live in pyproject.toml [tool.coverage.*]
# Raw SQLite data: coverage/.coverage (not Server/.coverage).
# (Coverage reads pyproject.toml; [coverage:*] sections here are not applied.)

# Module-specific floors are enforced via scripts/lint/check_coverage_thresholds.py
# (see THRESHOLDS in that script; raise toward higher targets as coverage improves).

filterwarnings =
    ignore:'flask.Markup' is deprecated:DeprecationWarning:flask_wtf
    ignore::DeprecationWarning:httplib2
    ignore::DeprecationWarning:pyparsing
    ignore:.*resume_download.*is deprecated.*:FutureWarning:huggingface_hub
    ignore:the load_module\(\) method is deprecated:DeprecationWarning
    ignore:ast.NameConstant is deprecated:DeprecationWarning:reportlab
