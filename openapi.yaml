          nullable: true
        buyer_name:
          type: string
          nullable: true
        buyer_email:
          type: string
          format: email
          nullable: true
      example:
        id: agr-1a2b3c4d-5e6f-7890-abcd-ef1234567890
        agent_id: b2c3d4e5-f6a7-8901-bcde-f23456789012
        buyer_id: c3d4e5f6-a7b8-9012-cdef-345678901234
        title: Buyer representation — Jordan Client
