              type: string
              nullable: true
    ServerLoggerConfig:
      type: object
      description: |
        Logger category toggles (booleans) plus logLevel. additionalProperties allows future category keys to be boolean or string without breaking older clients when the server adds flags.
      additionalProperties:
        oneOf:
          - type: boolean
          - type: string
      required:
        - polling
        - pages
        - hooks
        - auth
        - http
        - api
        - errors
        - security
        - logLevel
      properties:
        polling:
          type: boolean
        pages:
          type: boolean
        hooks:
          type: boolean
        auth:
          type: boolean
        http:
          type: boolean
        api:
          type: boolean
        errors:
          type: boolean
        security:
          type: boolean
        logLevel:
          type: string
          enum:
            - DEBUG
            - INFO
            - WARN
            - ERROR
    SigningMethod:
      type: string
      enum:
        - embedded
        - email
    SignupData:
      type: object
      description: |
        Self-service registration payload. Creates a Cognito user and application row;
        agents may supply optional `brokerage` and `phone` for CRM and notification defaults.
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          description: Display name stored on the user profile and shown in messaging and agreements.
          example: Alex Agent
        email:
          type: string
          format: email
          description: Unique account email; becomes the username for Cognito email flows.
          example: alex.agent@example.com
        password:
          type: string
          format: password
          description: Initial password meeting Cognito policy; user may change after first login.
          example: Str0ng!Passw0rd
        phone:
          type: string
          nullable: true
          description: E.164-style phone when SMS or voice verification is enabled for the pool.
          example: '+15559876543'
        brokerage:
          type: string
          nullable: true
          description: Optional `users.brokerage` for agents at signup; shown on agent-facing surfaces.
          example: Silver Key Realty
      example:
        name: Alex Agent
        email: alex.agent@example.com
        password: Str0ng!Passw0rd
        phone: '+15559876543'
        brokerage: Silver Key Realty
    SuccessResponse:
      type: object
      description: |
        Base success envelope extended via `allOf` across many routes. `success` is always
        true; `message` is optional human copy; `error` is normally null on success responses.
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always true for this schema; failed requests use ErrorResponse instead.
        message:
          type: string
          nullable: true
          description: Optional short status (e.g. OK or operation-specific confirmation).
        error:
          type: string
          nullable: true
          description: Reserved for symmetry with errors; keep null on success.
      example:
        success: true
        message: OK
        error: null
    SyncTemplatesResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
