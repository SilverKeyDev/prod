openapi: 3.1.0
info:
  title: SilverKey API
  version: 1.0.0
  description: Real estate AI platform API - comprehensive type definitions for frontend-backend contract
servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://staging.silverkey.com
    description: Staging environment
  - url: https://api.silverkey.com
    description: Production
tags:
  - name: Auth
    description: |
      Cognito-backed login/signup, HttpOnly cookies, and token refresh. There is no GET /auth/session; use POST /auth/refresh-token or GET /user/profile as a session probe.
  - name: User
    description: Current-user profile and favorite homes (routes under /api/v1/user).
  - name: Preferences
    description: Create/update persisted preferences (profile-adjacent fields; no PUT /user/profile on this API).
  - name: Search
    description: Authenticated property search (polygon pipeline).
  - name: Agent
    description: Agent workspace endpoints (e.g. assigned clients).
  - name: Calendar
    description: Google Calendar OAuth, events, and availability (routes under /api/v1/google).
  - name: Feed
    description: Listing feed, likes, and comments (routes under /api/v1/feed).
  - name: Documents
    description: Reports, document library, and secure uploads (routes under /api/v1/report, /api/v1/upload).
  - name: DocuSign
    description: DocuSign agreements, templates, and webhooks (routes under /api/v1/docusign and /api/v1/webhooks/docusign).
  - name: Admin
    description: Admin-only configuration and user management (routes under /api/v1/admin).
  - name: Client
    description: Client error reporting and diagnostics (routes under /api/v1/client).
  - name: Maps
    description: Google Maps script URL for the frontend (routes under /api/maps).
  - name: Offer
    description: Offer and negotiation helpers (routes under /api/v1/offer).
  - name: Research
    description: Property research and comparison tasks (routes under /api/v1/research).
  - name: Tasks
    description: Unified transaction task checklists (routes under /api/v1/tasks).
  - name: HomeMatching
    description: Background home-matching tasks (routes under /api/home-matching; uses Flask-Login).
  - name: Transactions
    description: Saved transaction address and checklist-linked documents (/api/v1/transactions).
  - name: Health
    description: Process liveness and infrastructure checks (/healthz).
  - name: Chatbot
    description: Property chatbot for address-based conversations (routes under /api/v1/chat).
paths:
  /api/v1/agent/clients:
    get:
      tags:
        - Agent
      summary: List agent clients
      description: Returns clients assigned to the authenticated agent.
      operationId: getAgentClients
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Clients retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentClientsResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not an agent or lacks access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Log in with email and password
      description: Authenticates via Cognito; sets HttpOnly session and refresh_token cookies on success.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginData'
      responses:
        '200':
          description: Login result (success or verification-required shape)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out
      description: Clears auth cookies.
      operationId: logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh session
      description: |
        Uses the session cookie (access JWT) and refresh_token cookie to issue new tokens. There is no separate GET /auth/session route; clients treat a successful refresh or GET /api/v1/user/profile as the session check.
      operationId: refreshToken
      responses:
        '200':
          description: Tokens refreshed; new cookies set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Missing or invalid tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Transient upstream error (e.g. Google refresh network failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupData'
      responses:
        '200':
          description: Signup result (may require email verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/preferences:
    get:
      tags:
        - Preferences
      summary: Get current user preferences
      operationId: getPreferences
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Preferences payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      preferences:
                        $ref: '#/components/schemas/PreferencesResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Preferences
      summary: Create or update user preferences
      description: |
        Persists preference payload for the current user. There is no PUT /api/v1/user/profile; profile-adjacent data is updated here (and closing mode via PUT /api/v1/user/closing-mode, not documented in this core set).
      operationId: upsertPreferences
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreferencesRequest'
      responses:
        '200':
          description: Preferences saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      preferences:
                        $ref: '#/components/schemas/PreferencesResponse'
                      message:
                        type: string
        '400':
          description: Invalid or empty body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/search/properties-by-polygon:
    post:
      tags:
        - Search
      summary: Search homes by viewport polygon
      description: |
        Primary authenticated polygon search. Replaces a hypothetical POST /search/homes (no such route).
      operationId: searchPropertiesByPolygon
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchByPolygonRequest'
      responses:
        '200':
          description: Search result or cached read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchByPolygonResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cannot resolve preferences scope for subject user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Search pipeline error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/favorite-homes:
    get:
      tags:
        - User
      summary: List favorite and listing homes
      description: Paginated liked homes plus parallel listings snapshot.
      operationId: listFavoriteHomes
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Favorites and listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteHomesResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - User
      summary: Replace favorite homes
      description: Replaces the user's favorites with the provided home objects.
      operationId: replaceFavoriteHomes
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateFavoritesRequest'
      responses:
        '200':
          description: Updated favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteHomesReplaceResponse'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/favorite-homes/add:
    post:
      tags:
        - User
      summary: Add one favorite home
      description: Persists full home payload and returns the updated liked-homes list.
      operationId: addFavoriteHome
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFavoriteRequest'
      responses:
        '200':
          description: Home added; full favorites list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteHomesReplaceResponse'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/favorite-homes/remove:
    post:
      tags:
        - User
      summary: Remove one favorite home by address
      description: Unlikes all matching rows for the normalized address and returns remaining liked homes.
      operationId: removeFavoriteHome
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveFavoriteRequest'
      responses:
        '200':
          description: Home removed from favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteHomesReplaceResponse'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Address not found in favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/profile:
    get:
      tags:
        - User
      summary: Get current user profile
      operationId: getUserProfile
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Profile payload (user dict under data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/profile-picture:
    post:
      tags:
        - User
      summary: Upload user profile picture
      description: Upload and update profile picture (JPEG, PNG, GIF allowed)
      operationId: uploadProfilePicture
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Profile picture uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePictureResponse'
        '400':
          description: Invalid file or file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/closing-mode:
    put:
      tags:
        - User
      summary: Update closing mode status
      description: Toggle user's closing mode (legacy API compatibility only)
      operationId: updateClosingMode
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClosingModeRequest'
      responses:
        '200':
          description: Closing mode updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateClosingModeResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/not-interested:
    get:
      tags:
        - User
      summary: List not-interested homes
      description: Retrieve the user's list of not-interested homes
      operationId: getNotInterestedHomes
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Not-interested homes retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotInterestedHomesResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - User
      summary: Mark home as not interested
      description: Add a home to the not-interested list
      operationId: addNotInterestedHome
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNotInterestedRequest'
      responses:
        '200':
          description: Home marked as not interested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotInterestedHomesResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - User
      summary: Remove home from not-interested list
      description: Undo not-interested status for a home
      operationId: removeNotInterestedHome
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveNotInterestedRequest'
      responses:
        '200':
          description: Home removed from not-interested list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotInterestedHomesResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Home not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - User
      summary: Update not-interested reason
      description: Update the reason for a not-interested home
      operationId: updateNotInterestedHome
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotInterestedRequest'
      responses:
        '200':
          description: Not-interested reason updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotInterestedHomesResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Home not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/google/me/events:
    get:
      tags:
        - Calendar
      summary: List user's Google Calendar events
      description: List events from authenticated user's own calendar (agents use /clients/{client_id}/availability for client calendars)
      operationId: listGoogleEvents
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: query
          required: false
          schema:
            type: string
            default: primary
        - name: timeMin
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: timeMax
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 100
      responses:
        '200':
          description: Events retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleEventListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Calendar
      summary: Create Google Calendar event
      description: Create a new event in user's Google calendar with optional cross-calendar creation for agent-client relationships
      operationId: createGoogleEvent
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleCalendarEventCreateBody'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleEventCreateResponse'
        '400':
          description: Invalid event data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing calendar permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/google/me/events/{event_id}:
    patch:
      tags:
        - Calendar
      summary: Update Google Calendar event
      description: Update an existing event in user's Google calendar
      operationId: updateGoogleEvent
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleCalendarEventCreateBody'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleCalendarApiResponse'
        '400':
          description: Invalid event data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing calendar permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Calendar
      summary: Delete Google Calendar event
      description: Delete an event from user's Google calendar
      operationId: deleteGoogleEvent
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
        - name: calendarId
          in: query
          required: false
          schema:
            type: string
            default: primary
      responses:
        '200':
          description: Event deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEventResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing calendar permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
