        id:
          type: string
        filename:
          type: string
        file_path:
          type: string
        status:
          type: string
          description: Pipeline state for the stored file (DB allows additional legacy values).
          enum:
            - uploaded
            - processing
            - processed
            - error
            - generating
        user_id:
          type: string
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
        document_type:
