    User:
      type: object
      description: |
        Persisted user row shape. Profile GET may add computed fields (e.g. profile_picture_url, roles). Closing mode is not stored on users (column removed); use PUT /user/closing-mode response only.
      required:
        - id
        - email
        - name
        - is_active
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        cognito_id:
          type: string
          nullable: true
          description: |
            AWS Cognito `sub` when the account uses Cognito credentials; null for Google-only accounts until linked, or when the row predates Cognito linkage.
        google_id:
          type: string
          nullable: true
          description: Google OAuth subject when the account is linked; omit or null for non-Google users.
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        last_logged_in:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp of last successful session activity when tracked.
        is_active:
          type: boolean
        is_agent:
          type: boolean
          nullable: true
        client_ids:
          oneOf:
            - type: array
              items:
                type: string
            - type: string
          nullable: true
          description: |
            Legacy wire shape: JSON array of client ids or a single comma-separated string. Prefer array in new clients; oneOf is required until all producers normalize.
        agent_id:
          oneOf:
            - type: array
              items:
                type: string
            - type: string
          nullable: true
          description: |
            Legacy wire shape: buyer agent id(s) as JSON array or string. Prefer array in new clients.
        mls_id:
          type: string
          nullable: true
        brokerage:
          type: string
          nullable: true
          description: |
            Agent brokerage name on the users row (DB column brokerage). Replaces the legacy column name agency_name from early migrations; API wire name is always brokerage.
        has_subscription:
          type: boolean
          nullable: true
        subscription:
          type: object
          nullable: true
          description: |
            Optional payment-provider subscription metadata. Listed properties are common; providers may add extra keys (additionalProperties allowed).
          properties:
            status:
              type: string
              nullable: true
            plan_id:
              type: string
              nullable: true
            customer_id:
              type: string
              nullable: true
            current_period_end:
              type: string
              format: date-time
              nullable: true
          additionalProperties: true
        has_preferences:
          type: boolean
          nullable: true
        preferences_version:
          type: string
          nullable: true
          description: Legacy preferences version marker on users row.
        profile_picture:
          type: string
          nullable: true
          description: S3 object key for the profile image when stored server-side.
        profile_picture_url:
          type: string
          format: uri
          nullable: true
          description: Presigned URL when returned by profile/upload handlers.
        roles:
          type: array
          items:
            type: string
          description: Role names from user_roles; typically present on GET /user/profile.
      example:
        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        email: jane.buyer@example.com
        name: Jane Buyer
        is_active: true
        phone: '+15551234567'
        cognito_id: us-east-1_a1b2c3d4-e5f6-7890-abcd-ef1234567890
        google_id: null
        is_agent: false
        has_preferences: true
        roles:
          - buyer
        created_at: '2024-01-15T10:30:00.000Z'
        updated_at: '2026-04-01T14:22:00.000Z'
        last_logged_in: '2026-04-07T09:15:00.000Z'
    UserAgentsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            agents:
              type: array
              items:
                $ref: '#/components/schemas/User'
              nullable: true
    UserId:
      type: string
      description: User identifier (UUID or string)
      example: 123e4567-e89b-12d3-a456-426614174000
    UserPreferencesData:
      type: object
      description: User search preferences for polygon search
      additionalProperties: true
      properties:
        max_price:
          type: number
          nullable: true
        min_price:
          type: number
          nullable: true
        bedrooms:
          type: integer
          nullable: true
        bathrooms:
          type: number
          nullable: true
        homeType:
          type: string
          nullable: true
    UserProfile:
      description: |
        Full application user record as returned by profile and admin user endpoints.
        Wire-identical to User; use this schema name when documenting "profile" responses
        (e.g. GET /api/v1/user/profile). Agent rows may include `mls_id`, `brokerage`, and
        `roles`; `profile_picture_url` is a short-lived presigned URL when present.
      allOf:
        - $ref: '#/components/schemas/User'
      example:
        id: b2c3d4e5-f6a7-8901-bcde-f23456789012
        email: alex.agent@example.com
        name: Alex Agent
        is_active: true
        is_agent: true
        mls_id: MLS-48291
        brokerage: Silver Key Realty
        cognito_id: us-east-1_a1b2c3d4-e5f6-7890-abcd-ef1234567890
        google_id: null
        roles:
          - agent
        profile_picture_url: https://s3.example.com/presigned/profile.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256
        created_at: '2024-01-15T10:30:00.000Z'
        updated_at: '2026-04-07T09:00:00.000Z'
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          description: |
            Standard success envelope with the current user in `user`. Some handlers also
            populate `data` with the same object for backward compatibility—clients should
            prefer `user` when both are present.
          properties:
            user:
              $ref: '#/components/schemas/User'
              nullable: true
            data:
              $ref: '#/components/schemas/User'
              nullable: true
              description: Alternative field name for user data
      example:
        success: true
        message: null
        error: null
        user:
          id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          email: jane.buyer@example.com
          name: Jane Buyer
          is_active: true
          is_agent: false
          roles:
            - buyer
        data: null
    VerifyData:
