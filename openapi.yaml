components:
  schemas:
    ActionPlanResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            plan:
              type: object
              additionalProperties: true
              description: Generated action plan structure
              nullable: true
    AddAgentResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            agent:
              $ref: '#/components/schemas/User'
              nullable: true
    AddCalendarACLRequest:
      type: object
      required:
        - role
        - scope
      properties:
        role:
          type: string
          enum:
            - owner
            - writer
            - reader
            - freeBusyReader
          description: Access role to grant
        scope:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - user
                - group
                - domain
                - default
            value:
              type: string
              nullable: true
              description: Email or domain (required for user/group/domain types)
    AddCalendarACLResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            rule:
              type: object
              description: Created ACL rule
              additionalProperties: true
              nullable: true
    AddCommentRequest:
      type: object
      required:
        - home_id
        - text
      properties:
        home_id:
          type: string
          description: ID of the home/listing to comment on
        text:
          type: string
          description: Comment text
    AddCommentResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            comment:
              $ref: '#/components/schemas/FeedCommentApiShape'
              nullable: true
    AddFavoriteRequest:
      type: object
      required:
        - home
      properties:
        home:
          $ref: '#/components/schemas/FavoriteHomePayload'
        client_id:
          type: string
          nullable: true
          description: When set, agent saves to client's favorites
      example:
        home:
          zpid: '12345678'
          address: 742 Evergreen Terrace
          city: Springfield
          state: IL
          zipcode: '62704'
          price: 425000
          bedrooms: 4
          bathrooms: 2.5
          livingArea: 2400
          homeType: SINGLE_FAMILY
          imageUrl: https://photos.examplecdn.com/listings/12345678/hero.jpg
          listingStatus: FOR_SALE
        client_id: c3d4e5f6-a7b8-9012-cdef-345678901234
    AreaBoundaryResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        area:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            label:
              type: string
            geoType:
              type: string
            state:
              type: string
            center:
              type: object
              nullable: true
              properties:
                lat:
                  type: number
                lng:
                  type: number
          description: Area metadata
        geometry:
          type: object
          nullable: true
          description: GeoJSON Polygon or MultiPolygon boundary geometry
          properties:
            type:
              type: string
              enum:
                - Polygon
                - MultiPolygon
            coordinates:
              type: array
              items: {}
              description: GeoJSON coordinate arrays
        viewport_ring:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ViewportPolygonPoint'
          description: Boundary as viewport-compatible ring of {lat, lng} points. Can be sent directly as viewport_polygon in polygon search.
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
    AreaSearchResult:
      type: object
      required:
        - id
        - name
        - label
        - geoType
        - state
      properties:
        id:
          type: string
          description: Slipstream area ID (hex hash)
        name:
          type: string
          description: Area name (e.g. "Atlanta", "Sandy Springs")
        label:
          type: string
          description: Formatted label (e.g. "Sandy Springs, GA")
        geoType:
          type: string
          description: Slipstream area type (area/neighborhood, area/postal-city, area/census-place, area/county, area/zipcode, area/township)
        state:
          type: string
          description: State postal abbreviation (e.g. "GA")
        place:
          type: string
          nullable: true
          description: Parent place name for neighborhoods and ZIP codes
    AreaSuggestionsResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaSearchResult'
          description: Matching geographic areas from Slipstream
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
    AddFeedLikeRequest:
      type: object
      required:
        - home_id
      properties:
        home_id:
          type: string
          description: ID of the home/listing to like
    AddNotInterestedRequest:
      type: object
      required:
        - home
      properties:
        home:
          $ref: '#/components/schemas/FavoriteHomePayload'
        why:
          type: string
          nullable: true
    AgentChatHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/AgentChatMessage'
              nullable: true
            conversation:
              $ref: '#/components/schemas/AgentConversation'
              nullable: true
    AgentChatMessage:
      type: object
      required:
        - id
        - conversation_id
        - sender_id
        - role
        - message
        - timestamp
      properties:
        id:
          type: string
        conversation_id:
          type: string
        sender_id:
          type: string
        role:
          type: string
          enum:
            - user
            - agent
            - assistant
        message:
          type: string
        shared_home_id:
          type: string
          nullable: true
        shared_document_id:
          type: string
          nullable: true
        timestamp:
          type: string
        is_read:
          type: boolean
          nullable: true
        read_at:
          type: string
          nullable: true
        event_request_status:
          $ref: '#/components/schemas/EventRequestStatus'
          nullable: true
    AgentClient:
      type: object
      description: |
        Buyer or client row as seen from the agent workspace (client list, messaging, tasks).
        `profile_picture` is a storage key unless a route explicitly expands to a URL.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          description: Application user id for the client.
        name:
          type: string
          description: Display name shown in agent UI and shared documents.
        email:
          type: string
          format: email
          description: Primary contact email for invites and DocuSign routing.
        phone:
          type: string
          nullable: true
          description: E.164 or formatted phone when on file.
        profile_picture:
          type: string
          nullable: true
          description: S3 key or relative path for avatar; not always a public URL.
        created_at:
          type: string
          nullable: true
          description: ISO 8601 timestamp when the client relationship or row was created.
      example:
        id: c3d4e5f6-a7b8-9012-cdef-345678901234
        name: Jordan Client
        email: jordan.client@example.com
        phone: '+15551112222'
        profile_picture: profiles/c3d4e5f6-a7b8-9012-cdef-345678901234.jpg
        created_at: '2025-08-01T16:45:00.000Z'
    AgentClientsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            clients:
              type: array
              items:
                $ref: '#/components/schemas/AgentClient'
              nullable: true
    AgentConnectionRequest:
      type: object
      required:
        - id
        - agent_id
        - client_id
        - requested_by_agent
        - status
        - created_at
      properties:
        id:
          type: string
        agent_id:
          type: string
        client_id:
          type: string
        requested_by_agent:
          type: boolean
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
        message:
          type: string
          nullable: true
        other_party_name:
          type: string
          nullable: true
        other_party_email:
          type: string
          nullable: true
        created_at:
          type: string
    AgentConversation:
      type: object
      required:
        - id
        - agent_id
        - client_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
        agent_id:
          type: string
        client_id:
          type: string
        client_name:
          type: string
          nullable: true
        client_email:
          type: string
          nullable: true
        client_profile_picture:
          type: string
          nullable: true
        agent_name:
          type: string
          nullable: true
        agent_email:
          type: string
          nullable: true
        agent_profile_picture:
          type: string
          nullable: true
        last_message:
          type: string
          nullable: true
        last_message_at:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        unread_count:
          type: integer
          nullable: true
        last_read_at:
          type: string
          nullable: true
    AgentConversationsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            conversations:
              type: array
              items:
                $ref: '#/components/schemas/AgentConversation'
              nullable: true
    AgentSearchResult:
      type: object
      description: |
        Agent user returned from agent search or picker APIs (e.g. connect with an agent).
        Lightweight directory row—brokerage fields appear only when explicitly added by the route.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          description: Agent application user id.
        name:
          type: string
          description: Public-facing agent name.
        email:
          type: string
          format: email
          description: Contact email for the agent record.
        phone:
          type: string
          nullable: true
          description: Office or mobile phone when exposed to search callers.
        created_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp of agent user creation when returned by search.
      example:
        id: b2c3d4e5-f6a7-8901-bcde-f23456789012
        name: Taylor Agent
        email: taylor.agent@example.com
        phone: '+15553334444'
        created_at: '2024-03-10T11:00:00.000Z'
    Agreement:
      type: object
      description: |
        DocuSign-backed agreement between an agent and buyer, including envelope metadata,
        participant list, optional revisions/history, and denormalized names for list views.
        `docusign_envelope_id` is the primary correlation key with DocuSign; `envelope_id`
        is legacy and may duplicate or diverge on older rows.
      required:
        - id
        - agent_id
        - buyer_id
        - title
        - agreement_type
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        agent_id:
          type: string
        buyer_id:
          type: string
        title:
          type: string
        agreement_type:
          $ref: '#/components/schemas/AgreementType'
        status:
          $ref: '#/components/schemas/AgreementStatus'
        property_address:
          type: string
          nullable: true
          description: Human-readable property line for titles and notifications.
        description:
          type: string
          nullable: true
          description: Free-text summary or internal notes shown on agreement detail.
        envelope_id:
          type: string
          nullable: true
          description: Legacy field
        docusign_envelope_id:
          type: string
          nullable: true
          description: Current DocuSign envelope UUID used for API callbacks and deep links.
        docusign_status:
          type: string
          nullable: true
          description: Last observed DocuSign composite status string (e.g. sent, completed).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        voided_at:
          type: string
          format: date-time
          nullable: true
        current_revision_id:
          type: string
          nullable: true
        signed_document_path:
          type: string
          nullable: true
          description: Storage path to the merged signed PDF after completion.
        certificate_path:
          type: string
          nullable: true
          description: Optional path to the completion certificate artifact.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/AgreementParticipant'
          nullable: true
        revisions:
