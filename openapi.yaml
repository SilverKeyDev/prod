    AgreementStatus:
      type: string
      description: |
        Internal agreement lifecycle (aligned with DocuSign envelope progression):
        - `draft`: Built locally, not yet sent to signers
        - `sent`: Envelope dispatched to recipients
        - `delivered`: At least one recipient has opened the envelope
        - `signed`: All required signatures captured (may still be processing)
        - `completed`: Envelope finished and artifacts stored
        - `voided`: Canceled per agent or system; not legally effective
        - `declined`: A recipient explicitly declined to sign
      enum:
        - draft
        - sent
        - delivered
        - signed
        - completed
        - voided
        - declined
    AgreementType:
      type: string
      description: |
        Template/category for the agreement row (`agreements.agreement_type`, VARCHAR). Drives
        which DocuSign template or checklist path is used and how the UI groups items.
        Values mean:
        - `buyer_representation`: Agency / buyer representation agreement
        - `offer`: Purchase offer or counter package
        - `inspection_addendum`: Inspection-related addenda or amendments
        - `financing_contingency`: Financing or loan contingency documents
        - `closing_disclosure`: CD / settlement-related disclosures
        - `other`: Catch-all custom agreement type
        - `uploaded_document`: Checklist-linked upload not from a standard template
      enum:
        - buyer_representation
        - offer
        - inspection_addendum
        - financing_contingency
        - closing_disclosure
        - other
        - uploaded_document
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          description: |
            Login, signup, token refresh, and verification responses. Session tokens are issued
            as HTTP-only cookies; deprecated token fields may be null. Use `needs_verification`
            and `code_delivery` for Cognito MFA / email confirmation flows.
          properties:
            user:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AuthSessionUser'
            access_token:
              type: string
              nullable: true
              deprecated: true
              description: Tokens are stored in HTTP-only cookies. Do not store client-side.
            id_token:
              type: string
              nullable: true
              deprecated: true
            refresh_token:
              type: string
              nullable: true
              deprecated: true
            user_sub:
              type: string
              nullable: true
              description: Cognito subject identifier; mirrors `AuthSessionUser.user_sub` for clients that cache it.
            verification_complete:
              type: boolean
              nullable: true
              description: True when email/phone verification requirements are satisfied for this session.
            login_failed:
              type: boolean
              nullable: true
              description: True when the last password or token exchange attempt failed (check `message` / `error`).
            auto_login_failed:
              type: boolean
              nullable: true
              description: True when silent refresh or cookie-based auto-login could not establish a session.
            code_delivery:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/CognitoCodeDeliveryDetails'
            needs_verification:
              type: boolean
              nullable: true
              description: True when the user must complete a verification step before full access.
      example:
        success: true
        message: null
        error: null
        user:
          auth_user_kind: session
          id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          email: jane.buyer@example.com
          name: Jane Buyer
        user_sub: us-east-1_a1b2c3d4-e5f6-7890-abcd-ef1234567890
        verification_complete: true
        login_failed: false
        auto_login_failed: false
        needs_verification: false
        access_token: null
        id_token: null
        refresh_token: null
        code_delivery: null
    AuthSessionUser:
      type: object
      description: |
        User payload returned on successful auth flows (login, refresh, verify) from create_auth_response. This is not a full UserProfile; use GET /api/v1/user/profile for the complete row shape.
      required:
        - auth_user_kind
        - email
        - user_sub
        - name
        - is_agent
        - auth_method
      properties:
        auth_user_kind:
          type: string
          const: session
          description: Discriminator for auth success payloads; always `session` for create_auth_response users.
        email:
          type: string
          format: email
        user_sub:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
        id:
          type: string
          nullable: true
          description: Application user id when the row exists; null if not yet linked.
        phone:
          type: string
          nullable: true
        is_agent:
          type: boolean
        auth_method:
          type: string
          enum:
            - unknown
            - cognito
            - google
            - both
          description: |
            How the session authenticated relative to linked identities on the user row:
            - `unknown`: Could not classify (legacy or transitional row)
            - `cognito`: Cognito username/password or hosted UI session
            - `google`: Google OAuth identity supplied the tokens
            - `both`: User has linked Cognito and Google identities
