          nullable: true
        integration_key:
          type: string
          nullable: true
        component_key:
          type: string
          nullable: true
        allow_unordered_check:
          type: boolean
          nullable: true
        suggestedFormIds:
          type: array
          items:
            type: string
          nullable: true
        optional:
          type: boolean
          nullable: true
        calendar:
          type: object
          properties:
            hasDates:
              type: boolean
            days:
              type: integer
            eventSchedule:
              type: array
