        Single row in the unified document library: either a user upload or a DocuSign-backed
        agreement. Use `library_kind` to branch UI; `status` reflects upload pipeline or
        envelope state depending on kind.
      required:
        - document_record_kind
        - library_item_id
        - library_kind
        - id
        - filename
        - file_path
        - status
        - user_id
      properties:
        document_record_kind:
          type: string
          const: library
          description: Discriminator for OpenAPI tooling; always `library` for unified library list rows.
        library_item_id:
          type: string
        library_kind:
          type: string
          enum:
            - upload
            - agreement
          description: |
            Source of the row:
            - `upload`: User- or agent-uploaded file in storage
            - `agreement`: DocuSign envelope or generated agreement tracked in agreements service
        id:
          type: string
        filename:
          type: string
        file_path:
          type: string
        status:
          type: string
          description: Normalized status string (upload lifecycle or agreement/envelope phase; compare to `library_kind`).
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
        user_id:
          type: string
        document_type:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        agreement_type:
          type: string
          nullable: true
        event_type:
          type: string
          enum:
            - listed
            - price_change
            - sold
            - withdrawn
          nullable: true
          description: |
            MLS-style listing event when the library item ties to a feed update:
            - `listed`: New listing associated with documents
            - `price_change`: Price update triggering revised paperwork
            - `sold`: Closed transaction context
            - `withdrawn`: Listing canceled or taken off market
